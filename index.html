<!DOCTYPE html>
<html lang="zh-Hant" data-palette="cream" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="打勾勾 — 跟自己打勾勾，說到做到。個人待辦清單，資料存在自己的瀏覽器。">
  <meta name="theme-color" content="#f7e9cf">
  <title>打勾勾 · 跟自己的約定</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="打勾勾">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='28'%20fill='%234f9db8'/%3E%3Cpath%20d='M28%2052l14%2014%2030-32'%20fill='none'%20stroke='white'%20stroke-width='10'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- 保底樣式：萬一外部樣式表沒載到（部署中／快取），畫面也不會爆開 -->
  <style>
    [hidden] { display: none !important; }
    .sprite { display: none; }
    svg.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    canvas.confetti { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  </style>
  <link rel="stylesheet" href="assets/styles.css?v=12">
</head>
<body>
  <a class="skip-link" href="#groups">跳到清單</a>

  <!-- 圖示：Lucide (https://lucide.dev) — ISC License，路徑內嵌，不依賴外部資源 -->

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" class="dot"/><circle cx="17.5" cy="10.5" r=".5" class="dot"/><circle cx="6.5" cy="12.5" r=".5" class="dot"/><circle cx="8.5" cy="7.5" r=".5" class="dot"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></symbol>

    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" class="dot"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><path d="M12 15V3"/></symbol>

    <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>

    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>

    <symbol id="i-week" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M8 14h8"/><path d="M8 18h5"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="4"/><circle cx="8.5" cy="8.5" r=".8" class="dot"/><circle cx="15.5" cy="8.5" r=".8" class="dot"/><circle cx="12" cy="12" r=".8" class="dot"/><circle cx="8.5" cy="15.5" r=".8" class="dot"/><circle cx="15.5" cy="15.5" r=".8" class="dot"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" class="stroked"/><circle cx="18" cy="16" r="3" class="stroked"/></symbol>
    <symbol id="i-voice" viewBox="0 0 24 24"><path d="M11 4.7 6.6 8H3.5a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5h3.1L11 19.3a.5.5 0 0 0 .8-.4V5.1a.5.5 0 0 0-.8-.4z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 5.6a9 9 0 0 1 0 12.8"/></symbol>

    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  </svg>

  <div class="app">
    <header class="hero">
      <div class="hero__bar">
        <div class="brand">
          <span class="brand__mark"><svg class="ico"><use href="#i-check"/></svg></span>
          <span class="brand__name">打勾勾</span>
        </div>
        <div class="hero__tools">
          <div class="pop">
            <button type="button" class="ghost-btn" id="paletteBtn" aria-haspopup="true" aria-expanded="false" aria-label="更換配色">
              <svg class="ico"><use href="#i-palette"/></svg>
            </button>
            <div class="pop__panel pop__panel--swatches" id="palettePanel" role="menu" hidden>
              <button type="button" role="menuitemradio" data-palette="cream"><i class="sw sw--cream"></i>奶油拿鐵</button>
              <button type="button" role="menuitemradio" data-palette="pastel"><i class="sw sw--pastel"></i>粉彩糖霜</button>
              <button type="button" role="menuitemradio" data-palette="lime"><i class="sw sw--lime"></i>螢光萊姆</button>
            </div>
          </div>
          <button type="button" class="ghost-btn" id="themeBtn" aria-label="切換淺色或深色主題">
            <svg class="ico"><use href="#i-moon"/></svg>
          </button>
          <div class="pop">
            <button type="button" class="ghost-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="更多功能">
              <svg class="ico"><use href="#i-more"/></svg>
            </button>
            <div class="pop__panel" id="morePanel" role="menu" hidden>
              <button type="button" role="menuitem" id="installBtn" hidden><svg class="ico"><use href="#i-install"/></svg>安裝到主畫面</button>
              <button type="button" role="menuitem" id="notifyBtn"><svg class="ico"><use href="#i-bell"/></svg><span id="notifyLabel">提醒：關</span></button>
              <button type="button" role="menuitem" id="soundBtn"><svg class="ico"><use href="#i-note"/></svg><span id="soundLabel">音效：開</span></button>
              <button type="button" role="menuitem" id="voiceBtn"><svg class="ico"><use href="#i-voice"/></svg><span id="voiceLabel">語音：關</span></button>
              <button type="button" role="menuitem" id="testNagBtn"><svg class="ico"><use href="#i-sparkles"/></svg>試罵一次</button>
              <button type="button" role="menuitem" id="toneBtn"><svg class="ico"><use href="#i-tone"/></svg><span id="toneLabel">語氣：毒舌</span></button>
              <button type="button" role="menuitem" id="shareBtn"><svg class="ico"><use href="#i-share"/></svg>產生今日成果卡</button>
              <button type="button" role="menuitem" id="exportBtn"><svg class="ico"><use href="#i-download"/></svg>匯出備份</button>
              <button type="button" role="menuitem" id="importBtn"><svg class="ico"><use href="#i-upload"/></svg>匯入備份</button>
              <button type="button" role="menuitem" id="clearDoneBtn"><svg class="ico"><use href="#i-eraser"/></svg>清除已完成</button>
              <button type="button" role="menuitem" id="clearAllBtn" class="danger"><svg class="ico"><use href="#i-trash"/></svg>刪除全部資料</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <nav class="nav" id="nav" role="tablist" aria-label="主要分頁">
      <button type="button" class="nav__btn" data-view="today" role="tab">
        <svg class="ico"><use href="#i-calendar"/></svg><span>今天</span>
        <i class="nav__dot" id="navDot" hidden></i>
      </button>
      <button type="button" class="nav__btn" data-view="week" role="tab">
        <svg class="ico"><use href="#i-week"/></svg><span>本週</span>
      </button>
      <button type="button" class="nav__btn" data-view="list" role="tab">
        <svg class="ico"><use href="#i-list"/></svg><span>清單</span>
      </button>
      <button type="button" class="nav__btn" data-view="trail" role="tab">
        <svg class="ico"><use href="#i-flame"/></svg><span>足跡</span>
      </button>
    </nav>

    <!-- ========== 今天 ========== -->
    <section class="view" id="viewToday" role="tabpanel" aria-label="今天">
      <p class="eyebrow" id="dateLine"></p>
      <h1 class="hero__title" id="greeting">你好</h1>
      <p class="hero__sub" id="heroSub"></p>

      <section class="progress" aria-label="今日進度">
        <div class="progress__text">
          <p class="progress__label">今日約定</p>
          <p class="progress__value"><span id="progPct">0</span><small>%</small></p>
          <p class="progress__hint" id="progHint">今天還沒有排定的約定</p>
        </div>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring__track" cx="60" cy="60" r="50"></circle>
            <circle class="ring__bar" id="ringBar" cx="60" cy="60" r="50"></circle>
          </svg>
          <span class="ring__label" id="ringLabel">0/0</span>
        </div>
      </section>

      <section class="credit" aria-label="信用">
        <svg class="mascot" id="mascot" data-mood="normal" viewBox="0 0 120 120" aria-hidden="true">
          <rect x="14" y="18" width="92" height="88" rx="30" class="mascot__body"/>
          <path d="M44 66l12 12 22-24" class="mascot__check"/>
          <g class="m-normal">
            <circle cx="46" cy="46" r="5.5" class="mascot__eye"/>
            <circle cx="74" cy="46" r="5.5" class="mascot__eye"/>
          </g>
          <g class="m-proud">
            <path d="M40 46q6-7 12 0" class="mascot__stroke"/>
            <path d="M68 46q6-7 12 0" class="mascot__stroke"/>
          </g>
          <g class="m-squint">
            <path d="M40 44h12" class="mascot__stroke"/>
            <path d="M68 44h12" class="mascot__stroke"/>
          </g>
          <g class="m-angry">
            <path d="M39 40l13 5M81 40l-13 5" class="mascot__stroke"/>
            <circle cx="46" cy="50" r="4.5" class="mascot__eye"/>
            <circle cx="74" cy="50" r="4.5" class="mascot__eye"/>
          </g>
        </svg>
        <div class="credit__body">
          <p class="bubble" id="mascotSay">…</p>
          <div class="credit__meta">
            <span class="credit__score">信用 <b id="creditScore">70</b></span>
            <div class="limitbar" title="進行中／額度"><i id="limitFill"></i></div>
            <span class="credit__limit" id="limitText"></span>
          </div>
        </div>
      </section>

      <section class="tiles" aria-label="狀態總覽">
        <button type="button" class="tile" data-page="all" data-tone="brand">
          <span class="tile__ico"><svg class="ico"><use href="#i-list"/></svg></span>
          <span class="tile__num" id="tAll">0</span>
          <span class="tile__label">全部</span>
        </button>
        <button type="button" class="tile" data-page="today" data-tone="accent">
          <span class="tile__ico"><svg class="ico"><use href="#i-calendar"/></svg></span>
          <span class="tile__num" id="tToday">0</span>
          <span class="tile__label">今天</span>
        </button>
        <button type="button" class="tile" data-page="overdue" data-tone="danger">
          <span class="tile__ico"><svg class="ico"><use href="#i-alarm"/></svg></span>
          <span class="tile__num" id="tOver">0</span>
          <span class="tile__label">逾期</span>
        </button>
        <button type="button" class="tile" data-page="done" data-tone="ok">
          <span class="tile__ico"><svg class="ico"><use href="#i-done"/></svg></span>
          <span class="tile__num" id="tDone">0</span>
          <span class="tile__label">已完成</span>
        </button>
      </section>

      <section class="compose">
        <form id="quickForm" autocomplete="off">
          <input type="text" id="quickInput" placeholder="今天想跟自己約定什麼？" aria-label="新增待辦事項">
          <button type="button" class="compose__more" id="backfillBtn" title="記下已經做完、但沒列在清單上的事">補記</button>
          <button type="button" class="compose__more" id="detailBtn" title="填寫完整欄位">詳細</button>
          <button type="submit" class="compose__go" aria-label="新增">
            <svg class="ico"><use href="#i-plus"/></svg>
          </button>
        </form>
        <details class="syntax">
          <summary>快速語法</summary>
          <p>
            <code>!高</code> <code>!中</code> <code>!低</code> 設定優先度 ·
            <code>#分類</code> 設定分類 ·
            <code>@今天</code> <code>@明天</code> <code>@下週</code> <code>@8/15</code> 設定到期日。
            例如：<em>寫月報 !高 #工作 @明天</em>
          </p>
        </details>
      </section>

      <div class="funrow">
        <button type="button" class="fun-btn" id="spinBtn"><svg class="ico"><use href="#i-dice"/></svg>別再選了</button>
        <button type="button" class="fun-btn" id="focusBtn"><svg class="ico"><use href="#i-eye"/></svg>監工模式</button>
      </div>

      <main class="groups" id="todayList"></main>
      <div class="empty" id="todayEmpty" hidden></div>
    </section>

    <!-- ========== 本週 ========== -->
    <section class="view" id="viewWeek" role="tabpanel" aria-label="本週" hidden>
      <div class="week__nav">
        <button type="button" class="ghost-btn" id="weekPrev" aria-label="上一週"><svg class="ico" style="transform:rotate(180deg)"><use href="#i-chevron"/></svg></button>
        <h2 class="week__label" id="weekLabel"></h2>
        <button type="button" class="ghost-btn" id="weekNext" aria-label="下一週"><svg class="ico"><use href="#i-chevron"/></svg></button>
      </div>
      <p class="week__hint">點日期看那天要做什麼；tab 下的小條是各天的負載。用 ‹ › 把事情搬到別天——未來的隨便搬，<b>今天和逾期的往後搬算改期，照罰</b>。</p>
      <div id="weekBoard" class="week"></div>
      <button type="button" class="week__someday" id="weekSomeday" hidden></button>
    </section>

    <!-- ========== 清單 ========== -->
    <section class="view" id="viewList" role="tabpanel" aria-label="清單" hidden>
      <section class="controls">
        <div class="search">
          <svg class="ico"><use href="#i-search"/></svg>
          <input type="search" id="searchInput" placeholder="搜尋待辦事項…" aria-label="搜尋待辦事項">
        </div>
        <label class="select">
          <select id="sortSelect" aria-label="排序方式">
            <option value="manual">自訂順序</option>
            <option value="due">依到期日</option>
            <option value="priority">依優先度</option>
            <option value="created">依建立時間</option>
          </select>
          <svg class="ico"><use href="#i-chevron"/></svg>
        </label>
      </section>

      <div class="cats" id="cats" role="group" aria-label="分類篩選"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="依日期分頁"></nav>

      <main class="groups" id="groups"></main>
      <div class="empty" id="empty" hidden></div>
      <div class="pager" id="pager" hidden></div>
    </section>

    <!-- ========== 足跡 ========== -->
    <section class="view" id="viewTrail" role="tabpanel" aria-label="約定足跡" hidden>
      <section class="trail">
        <div class="trail__head">
          <h2>約定足跡</h2>
          <button type="button" class="mini-btn" id="shareBtn2">
            <svg class="ico"><use href="#i-sparkles"/></svg>成果卡
          </button>
        </div>
        <div class="trail__stats">
          <div class="trail__stat">
            <span class="trail__ico" data-tone="accent"><svg class="ico"><use href="#i-flame"/></svg></span>
            <b id="streakNum">0</b>
            <small>連續達成</small>
          </div>
          <div class="trail__stat">
            <span class="trail__ico" data-tone="ok"><svg class="ico"><use href="#i-shield"/></svg></span>
            <b id="keepRate">—</b>
            <small>守約率</small>
          </div>
          <div class="trail__stat">
            <span class="trail__ico" data-tone="brand"><svg class="ico"><use href="#i-check"/></svg></span>
            <b id="totalDone">0</b>
            <small>累計完成</small>
          </div>
        </div>
        <div class="heatmap" id="heatmap"></div>
        <div class="trail__legend">
          <span>少</span>
          <i data-lv="0"></i><i data-lv="1"></i><i data-lv="2"></i><i data-lv="3"></i><i data-lv="4"></i>
          <span>多</span>
          <em id="trailRange"></em>
        </div>
      </section>
    </section>
  </div>

  <div class="focusbar" id="focusBar" hidden>
    <svg class="ico"><use href="#i-eye"/></svg>
    <div class="focusbar__body">
      <b id="focusTask">專注中</b>
      <span class="focusbar__time" id="focusTime">25:00</span>
    </div>
    <button type="button" id="focusQuit">放棄</button>
  </div>

  <button type="button" class="fab" id="fabBtn" aria-label="新增待辦事項（詳細）">
    <svg class="ico"><use href="#i-plus"/></svg>
  </button>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <dialog id="editDialog" class="sheet">
    <form method="dialog" id="editForm">
      <div class="sheet__head">
        <h2 id="dialogTitle">新的約定</h2>
        <button type="button" class="ghost-btn" id="cancelBtn" aria-label="關閉">
          <svg class="ico"><use href="#i-close"/></svg>
        </button>
      </div>

      <label class="field">
        <span>標題</span>
        <input type="text" name="title" id="fTitle" required maxlength="200" placeholder="例如：寫月報">
      </label>

      <label class="field">
        <span>備註</span>
        <textarea name="note" id="fNote" rows="3" maxlength="2000" placeholder="補充說明（選填）"></textarea>
      </label>

      <div class="field">
        <span>優先度</span>
        <div class="segmented">
          <label><input type="radio" name="priority" value="high"><span>高</span></label>
          <label><input type="radio" name="priority" value="normal" checked><span>中</span></label>
          <label><input type="radio" name="priority" value="low"><span>低</span></label>
        </div>
      </div>

      <div class="field">
        <span>到期日</span>
        <input type="date" name="due" id="fDue">
        <div class="quickdates">
          <button type="button" data-shift="0">今天</button>
          <button type="button" data-shift="1">明天</button>
          <button type="button" data-shift="7">下週</button>
          <button type="button" data-shift="clear">清除</button>
        </div>
      </div>

      <label class="field">
        <span>分類</span>
        <input type="text" name="category" id="fCategory" list="categoryList" maxlength="30" placeholder="例如：工作、家事、學習">
        <datalist id="categoryList"></datalist>
      </label>

      <div class="sheet__actions">
        <button type="button" class="btn" id="cancelBtn2">取消</button>
        <button type="submit" class="btn btn--primary" id="saveBtn">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="spinDialog" class="sheet sheet--spin">
    <div class="sheet__head">
      <h2>勾勾抽籤</h2>
      <button type="button" class="ghost-btn" id="spinClose" aria-label="關閉">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="slot" id="slot"><span id="slotText">…</span></div>
    <p class="spin-say" id="spinSay"></p>
    <div class="sheet__actions">
      <button type="button" class="btn" id="spinAgain">再抽</button>
      <button type="button" class="btn btn--primary" id="spinGo">就做這件，監工開始</button>
    </div>
  </dialog>

  <dialog id="shareDialog" class="sheet sheet--share">
    <div class="sheet__head">
      <h2 id="shareTitle">今日成果卡</h2>
      <button type="button" class="ghost-btn" id="shareClose" aria-label="關閉">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="shareview"><canvas id="shareCanvas" width="1080" height="1350"></canvas></div>
    <div class="sheet__actions">
      <button type="button" class="btn" id="shareCopy"><svg class="ico"><use href="#i-link"/></svg>複製圖片</button>
      <button type="button" class="btn btn--primary" id="shareSave"><svg class="ico"><use href="#i-download"/></svg>下載 PNG</button>
    </div>
  </dialog>

  <dialog id="nagDialog" class="sheet sheet--nag">
    <div class="nag__row">
      <svg class="mascot mascot--sm" data-mood="angry" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="14" y="18" width="92" height="88" rx="30" class="mascot__body"/>
        <path d="M44 66l12 12 22-24" class="mascot__check"/>
        <g class="m-angry">
          <path d="M39 40l13 5M81 40l-13 5" class="mascot__stroke"/>
          <circle cx="46" cy="50" r="4.5" class="mascot__eye"/>
          <circle cx="74" cy="50" r="4.5" class="mascot__eye"/>
        </g>
      </svg>
      <p id="nagText"></p>
    </div>
    <div class="sheet__actions">
      <button type="button" class="btn" id="nagAlt"></button>
      <button type="button" class="btn btn--primary" id="nagMain"></button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastAction" class="toast__action" hidden>復原</button>
  </div>

  <script src="assets/app.js?v=12"></script>
</body>
</html>
