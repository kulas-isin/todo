    const trainedToday = wi.trained.has(today);
    const first = (viewer.name || '').split(/\s+/)[0];
    const hi = hour < 5 ? '夜深了' : hour < 11 ? '早安' : hour < 18 ? '午安' : '晚安';
    const next = nextRoutine();
    // 近 7 天（含今天）對前 7 天：週一也不會因為換週就歸零
    const day0 = new Date(); day0.setHours(0, 0, 0, 0);
    const from7 = day0.getTime() - 6 * 86400000;
    const recent = state.workouts.filter((w) => w.start >= from7);
    const vol = recent.reduce((n, w) => n + workoutVolume(w), 0);
    const prevVol = state.workouts.filter((w) => w.start >= from7 - 7 * 86400000 && w.start < from7).reduce((n, w) => n + workoutVolume(w), 0);
    const diff = prevVol > 0 ? Math.round((vol - prevVol) / prevVol * 100) : null;

    el.innerHTML = `
      <div class="hello">
        <h1>${esc(hi)}${first ? `，${esc(first)}` : ''}</h1>
        <p>${trainedToday ? '今天練過了，還要再來一份嗎？' : '準備好接受挑戰了嗎？'}</p>
      </div>
      ${next ? `
      <button type="button" class="challenge" data-act="challenge" data-rid="${next.id}">
        <span class="challenge__icon"><svg class="ico"><use href="#i-dumbbell"/></svg></span>
        <span class="challenge__body">
          <small>今天的挑戰 <b>${next.lastAt ? `上次 ${dateLabel(next.lastAt)}` : '還沒練過'}</b></small>
          <strong>${esc(next.r.name)}</strong>
        </span>
        <span class="challenge__go" aria-hidden="true"><svg class="ico"><use href="#i-chevrons"/></svg></span>
      </button>` : ''}

      <h2 class="section-title"><span>你的課表</span><button type="button" class="ghost-btn" data-act="all-routines" aria-label="管理課表"><svg class="ico"><use href="#i-arrow"/></svg></button></h2>
      ${state.routines.length ? `<div class="rows">${state.routines.map((r, i) => routineCard(r, i, false)).join('')}</div>` : '<div class="empty"><b>還沒有課表</b>先建一份，或直接空白開始。</div>'}
      <button type="button" class="btn btn--block" data-act="blank" style="margin-top:12px"><svg class="ico"><use href="#i-play"/></svg>空白開始（邊練邊加動作）</button>

      <section class="inkcard" aria-label="近 7 天訓練量">
        <div class="inkcard__top">
          <div>
            <div class="inkcard__big">${fmtBig(vol)}<small>kg</small></div>
            <p class="inkcard__label">近 7 天訓練量${last ? ` · 上次 ${dateLabel(last.start)}` : ''}</p>
          </div>
          ${diff !== null ? `<span class="inkcard__pill">${diff >= 0 ? '+' : ''}${diff}% <svg class="ico"${diff < 0 ? ' style="transform:scaleY(-1)"' : ''}><use href="#i-trend"/></svg></span>` : ''}
        </div>
        ${weekChart(from7)}
        <div class="wkchart__legend"><span><i style="background:var(--on-dash)"></i>近 7 天</span><span><i style="background:var(--chart-prev, var(--brand))"></i>前 7 天</span></div>
      </section>

      <div class="tiles">
        <div class="tile tile--1">
          ${blobRing()}
          <div class="tile__body">
            <span class="tile__num">${wi.streak}<i class="heart"></i></span>
            <span class="tile__label">連續週數</span>
            <span class="tile__pill">${state.workouts.length} 次<small>累計訓練</small></span>
          </div>
        </div>
        <div class="tile tile--2">
          <span class="tile__icon"><svg class="ico"><use href="#i-flame"/></svg></span>
          <span class="tile__num">${recent.length}</span>
          <span class="tile__label">近 7 天訓練</span>
          <svg class="tile__wave" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C 20 20, 40 22, 60 34 S 100 10, 120 22 S 160 46, 200 18 L200 60 L0 60 Z"/></svg>
        </div>
      </div>
    `;
    bindRoutineCards(el);
    el.querySelector('[data-act="blank"]').onclick = () => startWorkout(null);
    el.querySelector('[data-act="all-routines"]').onclick = () => goto('routines');
    const ch = el.querySelector('[data-act="challenge"]');
    if (ch) ch.onclick = () => startWorkout(state.routines.find((x) => x.id === ch.dataset.rid));
  }

  // 輪替：最久沒練（或沒練過）的課表當今天的挑戰
  function nextRoutine() {
    let best = null;
    for (const r of state.routines) {
      const lastAt = state.workouts.filter((w) => w.routineId === r.id).reduce((m, w) => Math.max(m, w.start), 0);
      if (!best || lastAt < best.lastAt) best = { r, id: r.id, lastAt };
    }
    return best;
  }

  // 本週每天的訓練量（白線）對上週（奶茶線），平滑曲線
  function weekChart(from) {
    const W = 340, H = 150, T = 12, B = 30, L = 12, R = 12;
    const perDay = (from) => {
      const out = [0, 0, 0, 0, 0, 0, 0];
      for (const w of state.workouts) {
        const d = Math.floor((w.start - from) / 86400000);
        if (d >= 0 && d < 7) out[d] += workoutVolume(w);
      }
      return out;
    };
    const cur = perDay(from);
    const prev = perDay(from - 7 * 86400000);
    const todayIdx = 6;
    const labels = [0, 1, 2, 3, 4, 5, 6].map((i) => (i === 6 ? '今' : WEEKDAY[(new Date(from + i * 86400000).getDay() + 6) % 7]));
    const max = Math.max(1, ...cur, ...prev);
    const x = (i) => L + i * (W - L - R) / 6;
    const y = (v) => T + (1 - v / max) * (H - T - B);
    const curve = (vals, upto) => {
      const pts = vals.slice(0, upto + 1).map((v, i) => [x(i), y(v)]);
      return pts.map((p, i) => {
        if (!i) return `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
        const q = pts[i - 1], dx = (p[0] - q[0]) / 2;
        return `C${(q[0] + dx).toFixed(1)},${q[1].toFixed(1)} ${(p[0] - dx).toFixed(1)},${p[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
      }).join('');
    };
    return `
      <svg class="wkchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 7 天與前 7 天每天的訓練量">
        ${labels.map((d, i) => `<line class="grid" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}"/>`).join('')}
        <line class="now" x1="${x(todayIdx)}" x2="${x(todayIdx)}" y1="${T - 6}" y2="${H - B}"/>
        <path class="prev" d="${curve(prev, 6)}"/>
        <path class="cur" d="${curve(cur, todayIdx)}"/>
        ${cur.map((v, i) => (v > 0 && i <= todayIdx ? `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="4"/>` : '')).join('')}
        ${labels.map((d, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle"${i === todayIdx ? ' class="is-today"' : ''}>${d}</text>`).join('')}
      </svg>`;
  }

  // 粉彩方塊裡的波浪圓圈（純裝飾）
  function blobRing() {
    const path = (amp, k, rot) => {
      let d = '';
      for (let i = 0; i <= 96; i++) {
        const t = i / 96 * Math.PI * 2;
        const rr = 40 + amp * Math.sin(k * t + rot);
        d += `${i ? 'L' : 'M'}${(50 + rr * Math.cos(t)).toFixed(1)},${(50 + rr * Math.sin(t)).toFixed(1)}`;
      }
      return d + 'Z';
    };
    return `<svg class="tile__ring" viewBox="0 0 100 100" aria-hidden="true"><path d="${path(4, 7, 0)}"/><path d="${path(3.5, 6, 1.3)}"/></svg>`;
  }

  function renderAvatar() {
    const img = $('#avatarImg');
    if (viewer.avatarUrl) { img.src = viewer.avatarUrl; img.hidden = false; $('#avatarIco').hidden = true; }
  }

  function activeHtml() {
    const wk = state.active;
    const total = workoutSetsAll(wk);
    const done = workoutSets(wk);
    return `
      <div class="live">
        <div class="live__body">
          <input class="live__name" id="liveName" value="${esc(wk.name)}" maxlength="40" aria-label="訓練名稱">
          <div class="live__meta">${done}/${total} 組 · ${fmtBig(workoutVolume(wk))} kg</div>
        </div>
        <span class="live__time" id="liveTime">${clock(Date.now() - wk.start)}</span>
      </div>
      ${wk.note ? `<p class="live__note">${esc(wk.note)}</p>` : ''}
      ${wk.interval && wk.iv ? ivHtml(wk) : ''}
      ${wk.items.length ? wk.items.map(exCardHtml).join('') : '<div class="empty"><b>還沒有動作</b>按下面「加動作」開始。</div>'}
      <div class="live-actions">
        <button type="button" class="btn" data-act="add-ex"><svg class="ico"><use href="#i-plus"/></svg>加動作</button>
        <button type="button" class="btn" data-act="add-routine"><svg class="ico"><use href="#i-clipboard"/></svg>接一份課表</button>
        <button type="button" class="btn btn--primary" data-act="finish"><svg class="ico"><use href="#i-check"/></svg>完成訓練</button>
        <button type="button" class="btn btn--danger btn--sm" data-act="discard">放棄這場訓練</button>
      </div>
    `;
  }

  function exCardHtml(it, ii) {
    const last = lastFor(it.exId);
    const rec = recordFor(it.exId, state.active.id);
    const n = state.active.items.length;
    return `
      <div class="card ex${state.active.iv && state.active.iv.phase === 'work' && state.active.iv.idx === ii ? ' is-live' : ''}" data-ii="${ii}">
        <div class="ex__head">
          <div class="ex__title">
            <h3 class="ex__name">${esc(exName(it.exId))}</h3>
            ${it.ss ? (() => { const g = ssGroup(it); return g.length > 1 ? `<span class="ex__ss">超級組 ${g.indexOf(it) + 1}/${g.length} · ${g.indexOf(it) < g.length - 1 ? `做完接「${esc(exName(g[g.indexOf(it) + 1].exId))}」` : '做完這輪才休息'}</span>` : ''; })() : ''}
            ${it.note ? `<p class="ex__note">${esc(it.note)}</p>` : ''}
            <p class="ex__last">${esc(lastSummary(last))}</p>
            ${it.bump ? `<span class="ex__hint">${it.rp ? `上次啟動組超過 ${it.target} 下` : '上次全組達標'} → 今天 +${fmt(prefs.step)} kg</span>` : ''}
            ${it.rp ? `<span class="ex__rp${rpMet(it) ? ' is-met' : ''}">暫停休息 ${rpDone(it)} / ${it.rp} 下</span>` : ''}
          </div>
          <div class="ex__tools">
            <button type="button" class="ghost-btn ghost-btn--sm" data-act="up" aria-label="上移" ${ii === 0 ? 'disabled' : ''}><svg class="ico"><use href="#i-up"/></svg></button>
            <button type="button" class="ghost-btn ghost-btn--sm" data-act="down" aria-label="下移" ${ii === n - 1 ? 'disabled' : ''}><svg class="ico"><use href="#i-down"/></svg></button>
            <button type="button" class="ghost-btn ghost-btn--sm" data-act="remove" aria-label="移除動作"><svg class="ico"><use href="#i-close"/></svg></button>
          </div>
        </div>
        <div class="sets">
          <div class="set set__hd"><span>組</span><span>重量 kg</span><span></span><span>次數</span><span>✓</span></div>
          ${it.sets.map((s, si) => {
            const pr = s.done && rec.best && s.r > 0 && e1rm(s.w, s.r) > rec.best.e + 0.01;
            return `
            <div class="set${s.done ? ' is-done' : ''}${pr ? ' is-pr' : ''}" data-si="${si}">
              <span class="set__no">${pr ? '★' : it.rp ? (si === 0 ? '啟' : 'R' + si) : si + 1}</span>
              <input type="number" inputmode="decimal" step="0.5" min="0" value="${s.w || ''}" placeholder="0" data-f="w" aria-label="第 ${si + 1} 組重量">
              <span class="set__x">×</span>
              <input type="number" inputmode="numeric" step="1" min="0" value="${s.r || ''}" placeholder="0" data-f="r" aria-label="第 ${si + 1} 組次數">
              <button type="button" class="set__check" data-act="check" aria-label="${s.done ? '取消打勾' : '完成這組'}" aria-pressed="${s.done}"><svg class="ico"><use href="#i-check"/></svg></button>
            </div>`;
          }).join('')}
        </div>
        <div class="ex__foot">
          <button type="button" class="btn btn--sm" data-act="add-set"><svg class="ico"><use href="#i-plus"/></svg>加一組</button>
          <button type="button" class="btn btn--sm" data-act="del-set" ${it.sets.length ? '' : 'disabled'}><svg class="ico"><use href="#i-minus"/></svg>刪最後一組</button>
        </div>
      </div>`;
  }

  function bindActive(el) {
    const wk = state.active;
    el.querySelector('#liveName').addEventListener('input', (e) => { wk.name = e.target.value || '自由訓練'; save(); });
    el.querySelector('[data-act="add-ex"]').onclick = () => openPicker((ex) => {
      wk.items.push(makeItem(ex.id));
      save();
      renderTrain();
      const cards = el.querySelectorAll('.ex');
      if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    el.querySelector('[data-act="discard"]').onclick = () => discardWorkout(false);
    el.querySelector('[data-act="add-routine"]').onclick = openAppendRoutine;
    const ivt = el.querySelector('[data-act="iv-toggle"]');
    if (ivt) ivt.onclick = ivToggle;
    const ivs = el.querySelector('[data-act="iv-skip"]');
    if (ivs) ivs.onclick = ivSkip;
    if (wk.iv && wk.iv.running) holdWake();
    el.querySelector('[data-act="finish"]').onclick = finishWorkout;

    el.querySelectorAll('.ex').forEach((card) => {
      const ii = Number(card.dataset.ii);
      const it = wk.items[ii];
      card.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const act = btn.dataset.act;
        const row = btn.closest('.set');
        if (act === 'check') return toggleSet(ii, Number(row.dataset.si));
        if (act === 'add-set') {
          const ref = it.sets[it.sets.length - 1];
          const left = it.rp ? it.rp - rpDone(it) : 0;
          it.sets.push({ w: ref ? ref.w : 0, r: left > 0 ? left : (ref ? ref.r : (it.target || 8)), done: false });
        }
        if (act === 'del-set') it.sets.pop();
        if (act === 'remove') {
          if (it.sets.some((s) => s.done) && !(await ask(`移除「${exName(it.exId)}」？已打勾的組也會一起移除。`, '移除', true))) return;
          const at = wk.items.indexOf(it);
          if (at >= 0) wk.items.splice(at, 1);
        }
        if (act === 'up' && ii > 0) [wk.items[ii - 1], wk.items[ii]] = [wk.items[ii], wk.items[ii - 1]];
        if (act === 'down' && ii < wk.items.length - 1) [wk.items[ii + 1], wk.items[ii]] = [wk.items[ii], wk.items[ii + 1]];
        save();
        renderTrain();
      });
      // 輸入時只存資料、不重繪，避免手機鍵盤被收起
      card.addEventListener('input', (e) => {
        const f = e.target.dataset.f;
        if (!f) return;
        const si = Number(e.target.closest('.set').dataset.si);
        it.sets[si][f] = f === 'r' ? Math.round(num(e.target.value)) : num(e.target.value);
        // 改了第一組的重量，後面還沒做、重量一樣的組跟著改
        save();
        const rpEl = card.querySelector('.ex__rp');
        if (rpEl) { rpEl.textContent = `暫停休息 ${rpDone(it)} / ${it.rp} 下`; rpEl.classList.toggle('is-met', rpMet(it)); }
        const meta = el.querySelector('.live__meta');
        if (meta) meta.textContent = `${workoutSets(wk)}/${workoutSetsAll(wk)} 組 · ${fmtBig(workoutVolume(wk))} kg`;
      });
      card.addEventListener('change', (e) => {
        const f = e.target.dataset.f;
        if (f !== 'w') return;
        const si = Number(e.target.closest('.set').dataset.si);
        const prev = it.sets[si];
        let touched = false;
        for (let k = si + 1; k < it.sets.length; k++) {
          if (!it.sets[k].done && it.sets[k].w !== prev.w) { it.sets[k].w = prev.w; touched = true; }
        }
        if (touched) { save(); renderTrain(); }
      });
    });
  }

  // 練到一半接上另一份課表（例如練完主課表，再接收尾的超級組）
  function openAppendRoutine() {
    if (!state.routines.length) { toast('還沒有課表'); return; }
    openInfo('接一份課表', `
      <p class="sub" style="margin:0 0 10px">選一份課表，它的動作會加到這場訓練的最後面。</p>
      ${state.routines.map((r) => `<button type="button" class="card pick__routine routine" data-rid="${r.id}" style="margin-top:8px"><div class="routine__body"><h3 class="routine__name">${esc(r.name)}</h3><p class="routine__meta">${esc(r.items.map((it) => exName(it.exId)).join('・'))}</p></div></button>`).join('')}
    `, [['取消', '', () => {}]]);
    $('#infoBody').querySelectorAll('[data-rid]').forEach((b) => {
      b.onclick = () => {
        const r = state.routines.find((x) => x.id === b.dataset.rid);
        const wk = state.active;
        if (!r || !wk) return;
        const prefix = uid();
        const first = wk.items.length;
        for (const it of r.items) if (exById(it.exId)) wk.items.push(makeItem(it.exId, it, prefix));
        if (r.note && wk.items[first] && !wk.items[first].note.includes(r.note)) wk.items[first].note = r.note + (wk.items[first].note ? '\n' + wk.items[first].note : '');
        save();
        $('#infoDialog').close();
        renderTrain();
        toast(`已接上「${r.name}」`);
        const card = document.querySelector(`.ex[data-ii="${first}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  /* ---------- 畫面：課表 ---------- */
  function routineCard(r, i, editable) {
    const n = r.items.length;
    const kind = r.interval ? `間歇 ${r.interval.work}/${r.interval.rest} 秒` : r.items.some((it) => it.ss) ? '超級組' : r.items.some((it) => it.rp) ? '暫停休息' : `${r.items.reduce((m, it) => m + (it.sets || 0), 0)} 組`;
    const doneToday = state.workouts.some((w) => w.routineId === r.id && isoOf(new Date(w.start)) === todayIso());
    return `
      <div class="row routine" data-rid="${r.id}">
        <button type="button" class="row__tile row__tile--${(i % 2) + 1}" data-act="start" aria-label="開始「${esc(r.name)}」"><svg class="ico"><use href="#${r.interval ? 'i-timer' : 'i-dumbbell'}"/></svg></button>
        <button type="button" class="row__body" data-act="start" style="background:none;border:0;padding:0;text-align:left">
          <span class="row__name">${esc(r.name)}</span>
          <span class="row__meta">${n} 個動作 · ${esc(kind)}</span>
        </button>
        ${editable ? `<button type="button" class="ghost-btn ghost-btn--sm row__edit" data-act="edit" aria-label="編輯課表"><svg class="ico"><use href="#i-edit"/></svg></button>` : ''}
        <button type="button" class="row__check${doneToday ? ' is-on' : ''}" data-act="start" aria-label="${doneToday ? '今天練過了，再練一次' : '開始'}" style="padding:0">${doneToday ? '<svg class="ico"><use href="#i-check"/></svg>' : ''}</button>
      </div>`;
  }
  function bindRoutineCards(el) {
    el.querySelectorAll('.routine').forEach((card) => {
      const r = state.routines.find((x) => x.id === card.dataset.rid);
      const edit = card.querySelector('[data-act="edit"]');
      if (edit) edit.onclick = () => openRoutine(r);
      card.querySelectorAll('[data-act="start"]').forEach((b) => { b.onclick = () => startWorkout(r); });
    });
  }

  function renderRoutines() {
    const el = $('#viewRoutines');
    el.innerHTML = `
      <h1 class="title">課表</h1>
      <p class="sub">把固定要練的動作排好，開始時會自動帶入上次的重量；上次全組達標就建議加重。</p>
      ${state.routines.length ? `<div class="rows">${state.routines.map((r, i) => routineCard(r, i, true)).join('')}</div>` : '<div class="empty"><b>還沒有課表</b>建一份常練的組合吧。</div>'}
      <button type="button" class="btn btn--primary btn--block" data-act="new" style="margin-top:14px"><svg class="ico"><use href="#i-plus"/></svg>新增課表</button>
    `;
    bindRoutineCards(el);
    el.querySelector('[data-act="new"]').onclick = () => openRoutine(null);
  }

  let routineDraft = null;
  function openRoutine(r) {
    routineDraft = r
      ? { id: r.id, name: r.name, note: r.note || '', restAfter: r.restAfter || '', items: r.items.map((it) => ({ ...it })) }
      : { id: null, name: '', note: '', restAfter: '', items: [] };
    $('#routineTitle').textContent = r ? '編輯課表' : '新課表';
    $('#rName').value = routineDraft.name;
    $('#rNote').value = routineDraft.note;
    $('#rRestAfter').value = routineDraft.restAfter;
    $('#rWork').value = r && r.interval ? r.interval.work : '';
    $('#rRest').value = r && r.interval ? r.interval.rest : '';
    $('#rDelete').hidden = !r;
    renderRoutineItems();
    $('#routineDialog').showModal();
  }
  function renderRoutineItems() {
    const box = $('#rItems');
    if (!routineDraft.items.length) { box.innerHTML = '<p class="sub" style="margin:4px 0">還沒有動作</p>'; return; }
    box.innerHTML = `<div class="ritem ritem--hd"><span>動作</span><span>組</span><span>次</span><span>kg</span><span></span></div>` +
      routineDraft.items.map((it, i) => `
        <div class="ritem" data-i="${i}">
          <span class="ritem__name">${esc(exName(it.exId))}</span>
          <input type="number" inputmode="numeric" min="1" max="20" value="${it.sets}" data-f="sets" aria-label="組數">
          <input type="number" inputmode="numeric" min="1" max="100" value="${it.reps}" data-f="reps" aria-label="次數">
          <input type="number" inputmode="decimal" min="0" step="0.5" value="${it.weight || ''}" placeholder="自動" data-f="weight" aria-label="起始重量">
          <button type="button" class="ghost-btn ghost-btn--sm" data-act="del" aria-label="移除"><svg class="ico"><use href="#i-close"/></svg></button>
          <div class="ritem__more">
            <label>暫停休息湊 <input type="number" inputmode="numeric" min="0" max="100" value="${it.rp || ''}" placeholder="—" data-f="rp" aria-label="暫停休息目標次數"> 下</label>
            <label>組間 <input type="number" inputmode="numeric" min="0" max="900" value="${it.rest || ''}" placeholder="預設" data-f="rest" aria-label="組間休息秒數"> 秒</label>
            <label>超級組 <input type="text" class="ritem__ss" maxlength="4" value="${esc(it.ss || '')}" placeholder="—" data-f="ss" aria-label="超級組代號（同代號的動作輪流做）"></label>
            <input type="text" class="ritem__note" maxlength="80" value="${esc(it.note || '')}" placeholder="備註（選填）" data-f="note" aria-label="備註">
          </div>
        </div>`).join('');
  }
  function saveRoutine(e) {
    e.preventDefault();
    const name = $('#rName').value.trim();
    if (!name) { $('#rName').focus(); return; }
    const items = routineDraft.items.map((it) => ({
      exId: it.exId,
      sets: Math.max(1, Math.round(num(it.sets)) || 3),
      reps: Math.max(1, Math.round(num(it.reps)) || 8),
      weight: num(it.weight),
      rp: Math.round(num(it.rp)),
      rest: Math.round(num(it.rest)),
      ss: String(it.ss || '').trim().toUpperCase(),
      note: String(it.note || '').trim()
    }));
    const note = $('#rNote').value.trim();
    const restAfter = Math.round(num($('#rRestAfter').value));
    const work = Math.round(num($('#rWork').value));
    const interval = work > 0 ? { work, rest: Math.round(num($('#rRest').value)), roundRest: restAfter || 60 } : null;
    if (routineDraft.id) {
      const r = state.routines.find((x) => x.id === routineDraft.id);
      Object.assign(r, { name, note, restAfter, interval, items });
    } else {
      state.routines.push({ id: uid(), name, note, restAfter, interval, items });
    }
    save();
    $('#routineDialog').close();
    render();
    toast('課表已儲存');
  }

  /* ---------- 選動作 ---------- */
  let pickCallback = null;
  let pickPart = '';
  function openPicker(cb) {
    pickCallback = cb;
    pickPart = '';
    $('#pickSearch').value = '';
    renderPicker();
    $('#pickDialog').showModal();
    setTimeout(() => $('#pickSearch').focus(), 50);
  }
  function renderPicker() {
    const q = $('#pickSearch').value.trim();
    $('#pickParts').innerHTML = ['', ...PARTS].map((p) => `<button type="button" class="chip${p === pickPart ? ' is-on' : ''}" data-part="${p}">${p || '全部'}</button>`).join('');
    const list = state.exercises
      .filter((e) => (!pickPart || e.part === pickPart) && (!q || e.name.toLowerCase().includes(q.toLowerCase())))
      .sort((a, b) => (lastStart(b.id) - lastStart(a.id)) || a.name.localeCompare(b.name, 'zh-Hant'));
    const exact = state.exercises.some((e) => e.name === q);
    $('#pickList').innerHTML =
      (q && !exact ? `<div class="pick__item pick__new"><button type="button" class="btn btn--sm btn--primary" data-new>新增「${esc(q)}」</button><select class="input" id="pickNewPart" style="width:auto;height:36px" aria-label="部位">${PARTS.map((p) => `<option${p === (pickPart || '其他') ? ' selected' : ''}>${p}</option>`).join('')}</select></div>` : '') +
      list.map((e) => {
        const last = lastFor(e.id);
        return `<button type="button" class="pick__item" data-id="${e.id}"><span>${esc(e.name)}</span><small>${esc(e.part)}${last ? ' · ' + dateLabel(last.workout.start) : ''}</small></button>`;
      }).join('') +
      (!list.length && !q ? '<p class="sub">這個部位還沒有動作，輸入名稱新增。</p>' : '');
  }
  function lastStart(exId) { const l = lastFor(exId); return l ? l.workout.start : 0; }

  /* ---------- 畫面：紀錄 ---------- */
  function renderLog() {
    const el = $('#viewLog');
    const list = sortedWorkouts();
    if (!list.length) {
      el.innerHTML = '<h1 class="title">紀錄</h1><div class="empty" style="margin-top:14px"><b>還沒有訓練紀錄</b>練完按「完成訓練」就會出現在這裡。</div>';
      return;
    }
    let html = '<h1 class="title">紀錄</h1><p class="sub">共 ' + list.length + ' 次訓練</p>';
    let month = '';
    for (const w of list) {
      const d = new Date(w.start);
      const m = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
      if (m !== month) { month = m; html += `<h2 class="month">${m}</h2>`; }
      const prCount = (w.prs || []).length;
      html += `
        <button type="button" class="card log" data-wid="${w.id}">
          <div class="log__top"><h3 class="log__name">${esc(w.name)}</h3><span class="log__date">${dateLabel(w.start)}</span></div>
          <div class="log__meta">
            <span><b>${mins(w.end - w.start)}</b> 分鐘</span>
            <span><b>${workoutSets(w)}</b> 組</span>
            <span><b>${fmtBig(workoutVolume(w))}</b> kg</span>
            ${prCount ? `<span class="pill"><svg class="ico"><use href="#i-trophy"/></svg>破紀錄 ${prCount}</span>` : ''}
          </div>
          <p class="log__ex">${esc(w.items.map((it) => `${exName(it.exId)} ${it.sets.length}組`).join('・'))}</p>
        </button>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('.log').forEach((b) => { b.onclick = () => showWorkout(state.workouts.find((w) => w.id === b.dataset.wid)); });
  }

  function workoutDetailHtml(w) {
    return w.items.map((it) => `
      <div class="detail-ex">
        <h3>${esc(exName(it.exId))}${(w.prs || []).includes(it.exId) ? ' <span class="pill"><svg class="ico"><use href="#i-trophy"/></svg>PR</span>' : ''}</h3>
        <ol>${it.sets.map((s) => `<li><b>${fmt(s.w)}</b> kg × <b>${s.r}</b></li>`).join('')}</ol>
      </div>`).join('');
  }

  function showWorkout(w) {
    openInfo(`${esc(w.name)}`, `
      <p class="sub" style="margin:0 0 10px">${dateLabel(w.start)} ${pad(new Date(w.start).getHours())}:${pad(new Date(w.start).getMinutes())} · ${mins(w.end - w.start)} 分鐘 · ${workoutSets(w)} 組 · ${fmtBig(workoutVolume(w))} kg</p>
      ${workoutDetailHtml(w)}
    `, [
      ['刪除', 'btn--danger', async () => {
        if (!(await ask(`刪除 ${dateLabel(w.start)}「${w.name}」這筆紀錄？`, '刪除', true))) return;
        state.workouts = state.workouts.filter((x) => x.id !== w.id);
        save([w.start]); render(); toast('已刪除');
      }],
      ['編輯', '', () => editWorkout(w)],
      ['再練一次', 'btn--primary', () => startWorkout(null, w)]
    ]);
  }

  // 補填或修改已完成紀錄的重量與次數（例如練的時候忘了輸入重量）
  function editWorkout(w) {
    openInfo(`編輯「${esc(w.name)}」`, `
      <p class="sub" style="margin:0 0 12px">${dateLabel(w.start)}。每個動作可以先在「全部組」填一次重量，再個別調整。</p>
      ${w.items.map((it, ii) => `
        <div class="edit-ex" data-ii="${ii}">
          <h3>${esc(exName(it.exId))}</h3>
          <label class="edit-all">全部組 <input type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" data-all aria-label="${esc(exName(it.exId))} 全部組的重量"> kg</label>
          ${it.sets.map((x, si) => `
            <div class="edit-set" data-si="${si}">
              <span class="set__no">${it.rp ? (si === 0 ? '啟' : 'R' + si) : si + 1}</span>
              <input type="number" inputmode="decimal" step="0.5" min="0" value="${x.w || ''}" placeholder="0" data-f="w" aria-label="第 ${si + 1} 組重量">
              <span class="set__x">kg ×</span>
              <input type="number" inputmode="numeric" step="1" min="0" value="${x.r || ''}" placeholder="0" data-f="r" aria-label="第 ${si + 1} 組次數">
            </div>`).join('')}
        </div>`).join('')}
    `, [
      ['取消', '', () => showWorkout(w)],
      ['儲存', 'btn--primary', () => {
        $('#infoBody').querySelectorAll('.edit-ex').forEach((box) => {
          const it = w.items[Number(box.dataset.ii)];
          box.querySelectorAll('.edit-set').forEach((row) => {
            const x = it.sets[Number(row.dataset.si)];
            x.w = num(row.querySelector('[data-f="w"]').value);
            x.r = Math.round(num(row.querySelector('[data-f="r"]').value));
          });
        });
        // 重新判斷這次有沒有破紀錄（只跟更早的訓練比）
        w.prs = w.items.filter((it) => {
          const now = bestOf(it.sets);
          let before = null;
          for (const o of state.workouts) {
            if (o.id === w.id || o.start >= w.start) continue;
            for (const oi of o.items) if (oi.exId === it.exId) { const b = bestOf(oi.sets); if (b && (!before || b.e > before.e)) before = b; }
          }
          return now && before && now.e > before.e + 0.01;
        }).map((it) => it.exId);
        save([w.start]);
        render();
        toast('紀錄已更新');
        showWorkout(w);
      }]
    ]);
    $('#infoBody').querySelectorAll('[data-all]').forEach((inp) => {
      inp.addEventListener('input', () => {
        inp.closest('.edit-ex').querySelectorAll('[data-f="w"]').forEach((x) => { x.value = inp.value; });
      });
    });
  }

  function showSummary(w, prs) {
    const lines = prs.length
      ? ['破紀錄了！今天的你比過去都強。', '新 PR 入帳，這一勾很重。']
      : ['說到做到。下次再加一點。', '打卡完成，肌肉記得你今天來過。', '練完了，記得吃蛋白質。'];
    const say = lines[Math.floor(Math.random() * lines.length)];
    if (prs.length) sfx('pr'); else sfx('ding');
    openInfo('訓練完成', `
      <div class="summary">
        <p class="summary__big">${fmtBig(workoutVolume(w))} kg</p>
        <p class="summary__say">${say}</p>
        <div class="stats">
          <div class="stat"><b>${mins(w.end - w.start)}</b><small>分鐘</small></div>
          <div class="stat"><b>${workoutSets(w)}</b><small>組</small></div>
          <div class="stat"><b>${w.items.length}</b><small>動作</small></div>
        </div>
        ${prs.length ? `<ul class="prs">${prs.map((p) => `<li><svg class="ico"><use href="#i-trophy"/></svg>${esc(exName(p.exId))}<b>${fmt(p.now.w)}×${p.now.r}（估 1RM ${fmt(Math.round(p.now.e * 2) / 2)}）</b></li>`).join('')}</ul>` : ''}
      </div>
    `, [
      ['看明細', '', () => showWorkout(w)],
      ['好', 'btn--primary', () => {}]
    ]);
  }

  /* ---------- 畫面：進步 ---------- */
  function exHistory(exId) {
    // 每次訓練的最佳估算 1RM，舊到新
    return state.workouts
      .slice().sort((a, b) => a.start - b.start)
      .map((w) => {
        const its = w.items.filter((i) => i.exId === exId);
        if (!its.length) return null;
        const sets = its.flatMap((i) => i.sets);
        const best = bestOf(sets);
        if (!best) return null;
        return { w, best, sets, vol: sets.reduce((a, s) => a + setVolume(s), 0), maxW: Math.max(...sets.map((s) => s.w)) };
      })
      .filter(Boolean);
  }

  function renderProgress() {
    const el = $('#viewProgress');
    const rows = state.exercises
      .map((e) => ({ e, h: exHistory(e.id) }))
      .filter((x) => x.h.length && (!prefs.part || x.e.part === prefs.part))
      .sort((a, b) => b.h[b.h.length - 1].w.start - a.h[a.h.length - 1].w.start);
    const total = state.workouts.length;
    const allVol = state.workouts.reduce((s, w) => s + workoutVolume(w), 0);
    const prTotal = state.workouts.reduce((s, w) => s + (w.prs || []).length, 0);
    const usedParts = PARTS.filter((p) => state.exercises.some((e) => e.part === p && exHistory(e.id).length));

    el.innerHTML = `
      <h1 class="title">進步</h1>
      <div class="stats" style="margin-top:6px">
        <div class="stat"><b>${total}</b><small>累計訓練</small></div>
        <div class="stat"><b>${allVol >= 10000 ? fmt(Math.round(allVol / 100) / 10) + 'k' : fmtBig(allVol)}</b><small>累計總量 kg</small></div>
        <div class="stat"><b>${prTotal}</b><small>破紀錄次數</small></div>
      </div>
      <div class="section-title"><span>各動作最佳（估算 1RM）</span></div>
      ${usedParts.length > 1 ? `<div class="chips">${['', ...usedParts].map((p) => `<button type="button" class="chip${p === prefs.part ? ' is-on' : ''}" data-part="${p}">${p || '全部'}</button>`).join('')}</div>` : ''}
      ${rows.length ? rows.map(({ e, h }) => {
        const best = h.reduce((m, x) => (x.best.e > m.best.e ? x : m), h[0]);
        return `
        <button type="button" class="card lift" data-eid="${e.id}">
          <div class="lift__body">
            <h3 class="lift__name">${esc(e.name)}</h3>
            <p class="lift__meta">${esc(e.part)} · ${h.length} 次 · 最重 ${fmt(Math.max(...h.map((x) => x.maxW)))} kg</p>
          </div>
          ${sparkline(h.map((x) => x.best.e))}
          <div class="lift__pr"><b>${fmt(Math.round(best.best.e * 2) / 2)}</b><small>${fmt(best.best.w)}×${best.best.r}</small></div>
        </button>`;
      }).join('') : '<div class="empty"><b>還沒有資料</b>完成第一場訓練後，這裡會長出曲線。</div>'}
    `;
    el.querySelectorAll('.chip').forEach((c) => { c.onclick = () => { prefs.part = c.dataset.part; savePrefs(); renderProgress(); }; });
    el.querySelectorAll('.lift').forEach((b) => { b.onclick = () => showExercise(exById(b.dataset.eid)); });
  }

  function sparkline(vals) {
    if (vals.length < 2) return '<svg class="spark" viewBox="0 0 72 28"></svg>';
    const v = vals.slice(-10);
    const min = Math.min(...v), max = Math.max(...v);
    const span = max - min || 1;
    const d = v.map((x, i) => `${i ? 'L' : 'M'}${(i / (v.length - 1) * 68 + 2).toFixed(1)},${(26 - (x - min) / span * 24).toFixed(1)}`).join('');
    return `<svg class="spark" viewBox="0 0 72 28" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  function chart(h) {
    const W = 520, H = 200, L = 40, R = 12, T = 14, B = 26;
    const vals = h.map((x) => x.best.e);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max - min < 5) { min -= 2.5; max += 2.5; }
    const pad5 = (max - min) * 0.1;
    min = Math.max(0, min - pad5); max += pad5;
    const x = (i) => L + (h.length === 1 ? (W - L - R) / 2 : i / (h.length - 1) * (W - L - R));
    const y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const ticks = [0, 0.5, 1].map((f) => min + (max - min) * f);
    let running = 0;
    const pts = h.map((p, i) => {
      const isPr = p.best.e > running + 0.01;
      if (isPr) running = p.best.e;
      return `<circle class="pt${isPr && i ? ' is-pr' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.best.e).toFixed(1)}" r="4"><title>${dateLabel(p.w.start)}：${fmt(p.best.w)}×${p.best.r}</title></circle>`;
    }).join('');
    const line = h.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.best.e).toFixed(1)}`).join('');
    const area = h.length > 1 ? `<path class="area" d="${line}L${x(h.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z"/>` : '';
    const first = new Date(h[0].w.start), last = new Date(h[h.length - 1].w.start);
    return `
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="估算 1RM 走勢">
        ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="axis" x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`).join('')}
        ${area}<path class="line" d="${line}"/>${pts}
        <text class="axis" x="${L}" y="${H - 6}">${first.getMonth() + 1}/${first.getDate()}</text>
        ${h.length > 1 ? `<text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${last.getMonth() + 1}/${last.getDate()}</text>` : ''}
      </svg>`;
  }

  function showExercise(e) {
    const h = exHistory(e.id);
    const best = h.reduce((m, x) => (x.best.e > m.best.e ? x : m), h[0]);
    openInfo(esc(e.name), `
      <div class="kv">
        <div class="stat"><b>${fmt(Math.round(best.best.e * 2) / 2)}</b><small>估算 1RM kg</small></div>
        <div class="stat"><b>${fmt(Math.max(...h.map((x) => x.maxW)))}</b><small>最重 kg</small></div>
        <div class="stat"><b>${h.length}</b><small>次訓練</small></div>
      </div>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px">
        <span>部位</span>
        <select class="input" id="exPart" style="width:auto;height:38px">${PARTS.map((p) => `<option${p === e.part ? ' selected' : ''}>${p}</option>`).join('')}</select>
      </label>
      ${chart(h)}
      <p class="sub" style="margin:0 0 12px;font-size:12.5px">每點是那次的最佳組換算的 1RM（Epley 公式），黃點是破紀錄。</p>
      ${h.slice().reverse().map((x) => `
        <div class="detail-ex">
          <h3>${dateLabel(x.w.start)} <small style="color:var(--dim);font-weight:600">${esc(x.w.name)} · ${fmtBig(x.vol)} kg</small></h3>
          <ol>${x.sets.map((s) => `<li><b>${fmt(s.w)}</b> kg × <b>${s.r}</b></li>`).join('')}</ol>
        </div>`).join('')}
    `, [
      ['關閉', 'btn--primary', () => {}]
    ]);
    $('#exPart').onchange = (ev) => { e.part = ev.target.value; save(); render(); };
  }

  /* ---------- 通用對話框 ---------- */
  function openInfo(title, body, actions) {
    $('#infoTitle').innerHTML = title;
    $('#infoBody').innerHTML = body;
    const box = $('#infoActions');
    box.innerHTML = '';
    for (const [label, cls, fn] of actions) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `btn ${cls}`;
      b.textContent = label;
      b.onclick = () => { $('#infoDialog').close(); fn(); };
      box.appendChild(b);
    }
    const dlg = $('#infoDialog');
    if (dlg.open) dlg.close();
    dlg.showModal();
    $('#infoBody').scrollTop = 0;
    $('#infoBody').focus({ preventScroll: true });
  }

  function toast(text) {
    const t = $('#toast');
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }

  /* ---------- 外觀 ---------- */
  function applyTheme() {
    const root = document.documentElement;
    if (prefs.theme) root.dataset.theme = prefs.theme; else delete root.dataset.theme;
    if (!PALETTES[prefs.palette]) prefs.palette = 'harbor'; // 舊版的配色名稱一律換成新的預設
    root.dataset.palette = prefs.palette;
    document.querySelectorAll('.swatches [data-palette]').forEach((b) => b.classList.toggle('is-on', b.dataset.palette === prefs.palette));
    $('#paletteLabel').textContent = `配色：${PALETTES[prefs.palette]}`;
    const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    $('#themeBtn use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? '#111215' : '#f7f7f9';
  }

  /* ---------- 匯出／匯入 ---------- */
  let downloads = null;
  async function exportJson() {
    const data = { version: 1, app: 'pinky-lift', exportedAt: new Date().toISOString(), exercises: state.exercises, routines: state.routines, workouts: state.workouts };
    if (!downloads) { toast('這個檢視不能下載檔案'); return; }
    try {
      await downloads.save({ filename: `lift-backup-${todayIso()}.json`, data: JSON.stringify(data, null, 2) });
      toast('備份已下載');
    } catch (err) {
      if (err && err.code === 'declined') return;
      toast(err && err.code === 'rate_limited' ? '下載視窗已經開著了' : '這裡無法下載檔案');
    }
  }
  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.app !== 'pinky-lift' || !Array.isArray(data.workouts)) throw new Error('format');
        // 以 id 去重；同名動作合併成同一個
        const idMap = {};
        for (const e of data.exercises || []) {
          const same = state.exercises.find((x) => x.id === e.id) || state.exercises.find((x) => x.name === e.name);
          if (same) idMap[e.id] = same.id;
          else { state.exercises.push({ id: e.id, name: e.name, part: e.part || '其他' }); idMap[e.id] = e.id; }
        }
        const remap = (id) => idMap[id] || id;
        let added = 0;
        for (const r of data.routines || []) {
          if (state.routines.some((x) => x.id === r.id)) continue;
          state.routines.push({ ...r, items: (r.items || []).map((it) => ({ ...it, exId: remap(it.exId) })) });
        }
        for (const w of data.workouts) {
          if (state.workouts.some((x) => x.id === w.id)) continue;
          state.workouts.push({ ...w, items: (w.items || []).map((it) => ({ ...it, exId: remap(it.exId) })) });
          added++;
        }
        save(state.workouts.map((w) => w.start));
        render();
        toast(`匯入完成：新增 ${added} 筆訓練`);
      } catch (err) {
        toast('這不是練勾勾的備份檔');
      }
    };
    reader.readAsText(file);
  }

  /* ---------- 事件 ---------- */
  function setupEvents() {
    document.querySelectorAll('.nav__btn').forEach((b) => { b.onclick = () => goto(b.dataset.view); });

    $('#themeBtn').onclick = () => {
      const dark = prefs.theme ? prefs.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      prefs.theme = dark ? 'light' : 'dark';
      savePrefs();
      applyTheme();
    };
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    const panel = $('#morePanel');
    $('#moreBtn').onclick = (e) => {
      e.stopPropagation();
      panel.hidden = !panel.hidden;
      $('#moreBtn').setAttribute('aria-expanded', String(!panel.hidden));
    };
    document.addEventListener('click', (e) => { if (!panel.hidden && !panel.contains(e.target)) panel.hidden = true; });
    panel.addEventListener('click', (e) => { if (e.target.closest('button,a')) setTimeout(() => { panel.hidden = true; }, 0); });

    document.querySelectorAll('.swatches [data-palette]').forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); prefs.palette = b.dataset.palette; savePrefs(); applyTheme(); if (prefs.view === 'train') renderTrain(); };
    });
    $('#restBtn').onclick = () => {
      prefs.rest = REST_OPTIONS[(REST_OPTIONS.indexOf(prefs.rest) + 1) % REST_OPTIONS.length];
      savePrefs(); render();
      toast(prefs.rest ? `每組之間休息 ${prefs.rest} 秒` : '休息計時已關閉');
    };
    $('#stepBtn').onclick = () => {
      prefs.step = STEP_OPTIONS[(STEP_OPTIONS.indexOf(prefs.step) + 1) % STEP_OPTIONS.length];
      savePrefs(); render();
      toast(`達標後建議加 ${fmt(prefs.step)} kg`);
    };
    $('#exportBtn').onclick = exportJson;
    $('#importBtn').onclick = () => $('#importFile').click();
    $('#importFile').onchange = (e) => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; };
    $('#clearAllBtn').onclick = async () => {
      if (!(await ask('刪除所有訓練紀錄、課表與動作？這無法復原，建議先匯出備份。', '全部刪除', true))) return;
      const months = state.workouts.map((w) => w.start);
      stopRest();
      seed();
      save(months); // 那些月份現在是空的 → 雲端文件刪除
      render();
      toast('已全部刪除，回到預設課表');
    };

    $('#restMinus').onclick = () => adjustRest(-15);
    $('#restPlus').onclick = () => adjustRest(15);
    $('#restSkip').onclick = stopRest;

    document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => b.closest('dialog').close(); });
    document.querySelectorAll('dialog').forEach((d) => {
      d.addEventListener('click', (e) => { if (e.target === d) d.close(); }); // 點背景關閉
    });

    // 選動作
    $('#pickSearch').addEventListener('input', renderPicker);
    $('#pickSearch').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const first = $('#pickList [data-new], #pickList [data-id]');
      if (first) first.click();
    });
    $('#pickParts').addEventListener('click', (e) => {
      const c = e.target.closest('[data-part]');
      if (!c) return;
      pickPart = c.dataset.part;
      renderPicker();
    });
    $('#pickList').addEventListener('click', (e) => {
      let ex = null;
      if (e.target.closest('[data-new]')) {
        ex = findOrCreateEx($('#pickSearch').value, $('#pickNewPart').value);
        save();
      } else {
        const b = e.target.closest('[data-id]');
        if (b) ex = exById(b.dataset.id);
      }
      if (!ex) return;
      $('#pickDialog').close();
      if (pickCallback) pickCallback(ex);
    });

    // 課表編輯
    $('#routineForm').addEventListener('submit', saveRoutine);
    $('#rAdd').onclick = () => openPicker((ex) => {
      routineDraft.items.push({ exId: ex.id, sets: 3, reps: 8, weight: 0 });
      renderRoutineItems();
    });
    $('#rItems').addEventListener('input', (e) => {
      const row = e.target.closest('.ritem');
      if (!row || !e.target.dataset.f) return;
      routineDraft.items[Number(row.dataset.i)][e.target.dataset.f] = e.target.value;
    });
    $('#rItems').addEventListener('click', (e) => {
      if (!e.target.closest('[data-act="del"]')) return;
      routineDraft.items.splice(Number(e.target.closest('.ritem').dataset.i), 1);
      renderRoutineItems();
    });
    $('#rDelete').onclick = async () => {
      if (!(await ask('刪除這份課表？訓練紀錄不受影響。', '刪除課表', true))) return;
      state.routines = state.routines.filter((r) => r.id !== routineDraft.id);
      save();
      $('#routineDialog').close();
      render();
      toast('課表已刪除');
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { flushMeta(); wakeLock = null; return; }
      tick();
      if (state.active && state.active.iv && state.active.iv.running) holdWake();
      // 回到頁面時從帳號重新讀一次（例如剛在另一台裝置練完）；有還沒寫完的就先不讀
      if (cloud && pulled && !metaTimer) pull(false).catch(() => {});
    });
    window.addEventListener('pagehide', flushMeta);
  }

  load();
  applyTheme();
  setupEvents();
  render();
  tickTimer = setInterval(tick, 250);
  connectCloud();
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((d) => { downloads = d; $('#exportBtn').hidden = !d; }).catch(() => {});
  }
})();
</script>
