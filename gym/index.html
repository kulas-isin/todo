<title>練勾勾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="重訓紀錄：動作、組數、次數、重量，逐組打勾。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* =========================================================
   練勾勾 Lift — 樣式
   版面：白底大圓角卡片，粉彩色塊放數據，炭黑卡片放本週圖表。
   「配色」可切換七組：主色＋深色卡片＋兩個粉彩色塊都跟著換。
   ========================================================= */

:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--tile-1) 55%, #ffffff);
  --line: rgba(22, 24, 32, .09);
  --text: #1c1e24;
  --dim: #868a94;
  --on-brand: #ffffff;
  --on-ink: #ffffff;
  --accent: #e9a91c;
  --accent-wash: #fcf0d2;
  --danger: #a23d34;
  --danger-wash: #f5e5e3;
  --ok: #2b9d67;
  --ok-wash: #dcf2e6;
  --on-hero: #ffffff;
  /* 近 7 天訓練量卡片：用深色調的淺色版，不再是整塊深色 */
  --dash: #eaf1fe;
  --on-dash: var(--ink);
  --dash-dim: color-mix(in srgb, var(--ink) 55%, #ffffff);
  --brand: #f2614c;
  --brand-wash: #fde4df;
  --ink: #1f3150;
  --ink-dim: #9fb0cc;
  --tile-1: #dde7f6;
  --tile-2: #ffe3d6;
  --hero-1: #36598f;
  --hero-2: #1f3150;
  /* 字體：圓潤的幾何無襯線（含數字），中文用系統字 */
  --font: "Plus Jakarta Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", ui-sans-serif, system-ui, sans-serif;
  --font-num: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
  --r-sm: 14px;
  --r-md: 20px;
  --r-lg: 28px;
  --shadow-sm: 0 1px 2px rgba(20, 22, 30, .04);
  --shadow-md: 0 8px 24px rgba(20, 22, 30, .08);
  --shadow-lg: 0 24px 60px rgba(20, 22, 30, .18);
  --ease: cubic-bezier(.22, .68, .36, 1);
}
:root[data-palette="forest"] { --dash: #e7f8ee; --brand: #23936a; --brand-wash: #dbf1e7; --ink: #1f3d33; --ink-dim: #9dbcaf; --tile-1: #dcefe5; --tile-2: #fde4c8; --hero-1: #2aa477; --hero-2: #1a6a4d; }
:root[data-palette="grape"] { --dash: #efebff; --brand: #6d4dff; --brand-wash: #ece7ff; --ink: #2f2552; --ink-dim: #b1a7d6; --tile-1: #e9e4ff; --tile-2: #ffe2d9; --hero-1: #7c5cff; --hero-2: #4b33b8; }
:root[data-palette="teal"] { --dash: #e3f7f8; --brand: #0b8f9b; --brand-wash: #d8f2f4; --ink: #0f3d47; --ink-dim: #8fb7bf; --tile-1: #d6f0f2; --tile-2: #fde8c4; --hero-1: #11a3b0; --hero-2: #0b6f7a; }
:root[data-palette="sunset"] { --dash: #ffeedf; --brand: #e8650f; --brand-wash: #ffe8d4; --ink: #3a2a5e; --ink-dim: #b6aad6; --tile-1: #ffe9d2; --tile-2: #e7e1fb; --hero-1: #f7931e; --hero-2: #e4572e; }
:root[data-palette="red"] { --dash: #feecee; --brand: #e63946; --brand-wash: #fde6e7; --ink: #262a33; --ink-dim: #9aa0ab; --tile-1: #dcecf2; --tile-2: #fde5c4; --hero-1: #ee4450; --hero-2: #c1121f; }
:root[data-palette="harbor"] { --dash: #e6f2fb; --brand: #bf092f; --brand-wash: #fcecef; --ink: #132440; --ink-dim: #9fb0c8; --tile-1: #d3efed; --tile-2: #d8e8f8; --hero-1: #bf092f; --hero-2: #16476a; --ok: #3b9797; --ok-wash: #d8eeee; --chart-prev: #3b9797; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111215;
    --surface: #1a1c21;
    --surface-2: #23262c;
    --line: rgba(255, 255, 255, .08);
    --text: #f2f3f5;
    --dim: #8f949e;
    --on-brand: #ffffff;
    --accent: #f2c14e;
    --accent-wash: #43361a;
    --danger: #e6a39b;
    --danger-wash: #3d2422;
    --ok: #5fd09a;
    --ok-wash: #1d3d2e;
    --dash: color-mix(in srgb, var(--ink) 55%, var(--surface));
    --on-dash: var(--text);
    --dash-dim: var(--dim);
    --brand: #ff8a78; --brand-wash: #43251f; --ink: #22344f; --ink-dim: #a3b3cd; --tile-1: #1b2638; --tile-2: #3b2620; --hero-1: #2c4a7a; --hero-2: #1a2a45;
  }
  :root[data-palette="forest"]:not([data-theme="light"]) { --brand: #4cc896; --brand-wash: #163a2d; --ink: #1f3a31; --ink-dim: #9dbcaf; --tile-1: #19302a; --tile-2: #3a2d1d; --hero-1: #238a63; --hero-2: #164d39; }
  :root[data-palette="grape"]:not([data-theme="light"]) { --brand: #a28bff; --brand-wash: #2c2450; --ink: #2f2752; --ink-dim: #b5abd8; --tile-1: #241f3d; --tile-2: #3b2522; --hero-1: #5b40d6; --hero-2: #35237f; }
  :root[data-palette="teal"]:not([data-theme="light"]) { --brand: #3cc6d1; --brand-wash: #123a40; --ink: #133c45; --ink-dim: #96bec6; --tile-1: #15303a; --tile-2: #3b2f1a; --hero-1: #0e8a95; --hero-2: #095159; }
  :root[data-palette="sunset"]:not([data-theme="light"]) { --brand: #ff9a4d; --brand-wash: #45291a; --ink: #352a55; --ink-dim: #b6aad6; --tile-1: #3a2a1b; --tile-2: #262138; --hero-1: #d9661c; --hero-2: #a83a1c; }
  :root[data-palette="red"]:not([data-theme="light"]) { --brand: #ff4d5a; --brand-wash: #3d1a1e; --ink: #2b2f38; --ink-dim: #a3a8b3; --tile-1: #1d2a31; --tile-2: #3a2b1b; --hero-1: #d6232f; --hero-2: #8c0e18; }
  :root[data-palette="harbor"]:not([data-theme="light"]) { --brand: #ef3b5c; --brand-wash: #3d1520; --ink: #1c3358; --ink-dim: #a3b4cc; --tile-1: #163236; --tile-2: #172c40; --hero-1: #b3123a; --hero-2: #16476a; --ok: #5cc2c2; --ok-wash: #163236; --chart-prev: #5cc2c2; }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111215;
    --surface: #1a1c21;
    --surface-2: #23262c;
    --line: rgba(255, 255, 255, .08);
    --text: #f2f3f5;
    --dim: #8f949e;
    --on-brand: #ffffff;
    --accent: #f2c14e;
    --accent-wash: #43361a;
    --danger: #e6a39b;
    --danger-wash: #3d2422;
    --ok: #5fd09a;
    --ok-wash: #1d3d2e;
    --dash: color-mix(in srgb, var(--ink) 55%, var(--surface));
    --on-dash: var(--text);
    --dash-dim: var(--dim);
    --brand: #ff8a78; --brand-wash: #43251f; --ink: #22344f; --ink-dim: #a3b3cd; --tile-1: #1b2638; --tile-2: #3b2620; --hero-1: #2c4a7a; --hero-2: #1a2a45;
}
:root[data-palette="forest"][data-theme="dark"] { --brand: #4cc896; --brand-wash: #163a2d; --ink: #1f3a31; --ink-dim: #9dbcaf; --tile-1: #19302a; --tile-2: #3a2d1d; --hero-1: #238a63; --hero-2: #164d39; }
:root[data-palette="grape"][data-theme="dark"] { --brand: #a28bff; --brand-wash: #2c2450; --ink: #2f2752; --ink-dim: #b5abd8; --tile-1: #241f3d; --tile-2: #3b2522; --hero-1: #5b40d6; --hero-2: #35237f; }
:root[data-palette="teal"][data-theme="dark"] { --brand: #3cc6d1; --brand-wash: #123a40; --ink: #133c45; --ink-dim: #96bec6; --tile-1: #15303a; --tile-2: #3b2f1a; --hero-1: #0e8a95; --hero-2: #095159; }
:root[data-palette="sunset"][data-theme="dark"] { --brand: #ff9a4d; --brand-wash: #45291a; --ink: #352a55; --ink-dim: #b6aad6; --tile-1: #3a2a1b; --tile-2: #262138; --hero-1: #d9661c; --hero-2: #a83a1c; }
:root[data-palette="red"][data-theme="dark"] { --brand: #ff4d5a; --brand-wash: #3d1a1e; --ink: #2b2f38; --ink-dim: #a3a8b3; --tile-1: #1d2a31; --tile-2: #3a2b1b; --hero-1: #d6232f; --hero-2: #8c0e18; }
:root[data-palette="harbor"][data-theme="dark"] { --brand: #ef3b5c; --brand-wash: #3d1520; --ink: #1c3358; --ink-dim: #a3b4cc; --tile-1: #163236; --tile-2: #172c40; --hero-1: #b3123a; --hero-2: #16476a; --ok: #5cc2c2; --ok-wash: #163236; --chart-prev: #5cc2c2; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.55 var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

.sprite { display: none; }
.ico {
  width: 20px; height: 20px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
.ico .dot { fill: currentColor; stroke: none; }

.app {
  max-width: 720px;
  margin: 0 auto;
  padding-block: clamp(18px, 3.5vw, 30px) 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 25; background: var(--bg);
}
.num, .stat b, .live__time, .rest__time, .summary__big, .lift__pr b, .set input, .set__no {
  font-family: var(--font-num);
}

/* ---------- 標頭 ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.bar__right { display: flex; align-items: center; gap: 8px; }
.square-btn {
  width: 52px; height: 52px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--text); border: 0; border-radius: 16px;
  transition: transform .15s var(--ease);
}
.square-btn:active { transform: scale(.95); }
.square-btn .ico { width: 22px; height: 22px; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none;
  display: grid; place-items: center; background: var(--brand-wash); color: var(--brand);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .ico { width: 22px; height: 22px; }
.swatches { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 6px; padding: 4px 8px 0; }
.pop__panel .swatches button {
  padding: 5px; gap: 0; border-radius: 999px; border: 2px solid transparent; background: var(--surface-2);
}
.pop__panel .swatches button.is-on { border-color: var(--brand); }
.swatches i { width: 12px; height: 12px; border-radius: 50%; display: block; margin-left: -3px; box-shadow: 0 0 0 1.5px var(--surface); }
.swatches i:first-child { margin-left: 0; }
.swatches__label { margin: 4px 12px 6px; font-size: 12px; color: var(--dim); }

.ghost-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  color: var(--text); background: transparent; border: 0; border-radius: 50%;
  transition: background-color .2s var(--ease), transform .2s var(--ease);
}
.ghost-btn:hover { background: var(--surface); }
.ghost-btn:active { transform: scale(.94); }
.ghost-btn--sm { width: 32px; height: 32px; }
.ghost-btn--sm .ico { width: 17px; height: 17px; }

.pop { position: relative; }
.pop__panel {
  position: absolute; left: 0; top: calc(100% + 6px); z-index: 50;
  min-width: 210px; padding: 6px;
  background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
}
.pop__panel button, .pop__panel a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 0; border-radius: var(--r-sm);
  background: transparent; text-align: left; font-size: 14.5px;
  color: var(--text); text-decoration: none;
}
.pop__panel button:hover, .pop__panel a:hover { background: var(--surface-2); }
.pop__panel .danger { color: var(--danger); }

/* ---------- 分頁列 ---------- */
.nav {
  display: flex; gap: 6px; padding: 6px; margin-bottom: 20px;
  background: var(--dash); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-md);
}
.nav__btn {
  position: relative; flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 8px; font-size: 14.5px; font-weight: 600;
  color: var(--dim); background: transparent; border: 0; border-radius: 999px;
  transition: all .2s var(--ease);
}
.nav__btn { color: var(--dash-dim); }
.nav__btn:hover { color: var(--on-dash); }
.nav__btn.is-on { background: var(--surface); color: var(--brand); box-shadow: 0 2px 8px rgba(20, 22, 30, .08); }
.nav__btn .ico { width: 18px; height: 18px; }
.nav__dot {
  position: absolute; top: 7px; right: 16px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--dash);
}

.view { animation: viewIn .22s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }

h1.title { margin: 6px 2px 4px; font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
.sub { margin: 0 2px 16px; color: var(--dim); font-size: 14px; }
.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 26px 2px 12px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: var(--text);
}
.section-title .ghost-btn { width: 36px; height: 36px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface); border-radius: var(--r-lg);
  border: 1px solid var(--line); padding: 16px 18px;
}
.card + .card { margin-top: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px;
  font-weight: 700; font-size: 15px;
  background: var(--surface-2); color: var(--text);
  border: 0; border-radius: 999px;
  transition: transform .15s var(--ease), filter .2s;
}
.btn:active { transform: scale(.97); }
/* 主要按鈕：紅字配淡紅底，紅色只當重點不鋪滿 */
.btn--primary { background: var(--brand-wash); color: var(--brand); }
.btn--danger { background: var(--danger-wash); color: var(--danger); }
.btn--block { width: 100%; }
.btn--sm { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn .ico { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- 週列 ---------- */
.weekdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.weekdot { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.weekdot i {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--dim);
}
.weekdot.is-done i { background: var(--brand); color: var(--on-brand); }
.weekdot.is-today i { box-shadow: 0 0 0 2px var(--brand); }
.weekdot.is-today { color: var(--text); font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat small { color: var(--dim); font-size: 12px; }

/* ---------- 課表卡 ---------- */
.routine { display: flex; align-items: center; gap: 12px; }
.routine__body { flex: 1; min-width: 0; }
.routine__name { margin: 0; font-size: 16.5px; font-weight: 800; }
.routine__meta { margin: 2px 0 0; color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.routine__actions { display: flex; align-items: center; gap: 4px; flex: none; }

.empty {
  text-align: center; color: var(--dim); padding: 28px 16px; font-size: 14.5px;
  background: var(--surface); border-radius: var(--r-lg); border: 1px solid var(--line);
}
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

/* ---------- 進行中的訓練 ---------- */
.live {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  margin: 0 -4px 14px; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--text); border-radius: var(--r-lg); box-shadow: var(--shadow-md);
}
.live__body { flex: 1; min-width: 0; }
.live__name {
  width: 100%; margin: 0; padding: 0; border: 0; background: transparent;
  font-size: 18px; font-weight: 800; color: inherit; outline: none;
}
.live__meta { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.live__time { color: var(--brand); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }

.ex { padding: 14px 14px 12px; }
.ex__head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.ex__title { flex: 1; min-width: 0; }
.ex__name { margin: 0; font-size: 16.5px; font-weight: 800; }
.ex__last { margin: 1px 0 0; font-size: 12.5px; color: var(--dim); }
.ex__hint {
  display: inline-block; margin-top: 4px; padding: 2px 9px;
  font-size: 12px; font-weight: 700; border-radius: 999px;
  background: var(--accent-wash); color: var(--accent);
}
.ex__tools { display: flex; gap: 0; flex: none; margin: -4px -4px 0 0; }

.sets { display: flex; flex-direction: column; gap: 6px; }
.set {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) 18px minmax(0, 1fr) 44px;
  align-items: center; gap: 6px;
  padding: 4px 4px 4px 6px; border-radius: var(--r-sm);
  transition: background-color .2s;
}
.set__hd { font-size: 11.5px; color: var(--dim); font-weight: 700; letter-spacing: .06em; }
.set__hd span { text-align: center; }
.set__no { font-weight: 800; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
.set__x { text-align: center; color: var(--dim); font-size: 14px; }
.set input {
  width: 100%; min-width: 0; height: 40px; padding: 0 8px;
  text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--surface-2); border: 1.5px solid transparent; border-radius: 10px;
  -moz-appearance: textfield;
}
.set input::-webkit-outer-spin-button, .set input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.set input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.set__check {
  width: 44px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 10px;
  background: var(--surface-2); color: var(--dim);
  transition: all .15s var(--ease);
}
.set__check .ico { width: 20px; height: 20px; stroke-width: 3; }
.set__check:active { transform: scale(.92); }
.set.is-done { background: var(--ok-wash); }
.set.is-done input { background: transparent; }
.set.is-done .set__check { background: var(--ok); color: #fff; }
.set.is-pr .set__no { color: var(--accent); }

.ex__foot { display: flex; gap: 8px; margin-top: 10px; }
.ex__foot .btn { flex: 1; }

.live-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.live-actions .btn--primary, .live-actions .btn--danger { grid-column: 1 / -1; }
.live-actions .btn--danger { justify-self: center; background: transparent; }
.ex__ss {
  display: inline-block; margin: 0 0 4px; padding: 2px 9px;
  font-size: 12px; font-weight: 700; border-radius: 999px;
  background: var(--brand); color: var(--on-brand);
}
.pick__routine { width: 100%; text-align: left; border: 0; cursor: pointer; }

/* ---------- 休息計時 ---------- */
.rest {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 45;
  width: min(560px, calc(100% - 24px));

<script>
/* =========================================================
   練勾勾 Lift — 重訓紀錄
   純前端，資料存在 localStorage。每一組都是一個小約定：做完就打勾。
   ========================================================= */
(() => {
  'use strict';

  const STORE_KEY = 'pinky-lift/v1';
  const PREF_KEY = 'pinky-lift/prefs';
  const REST_KEY = 'pinky-lift/rest';
  const VIEWS = ['train', 'routines', 'log', 'progress'];
  const PARTS = ['胸', '背', '腿', '肩', '手臂', '臀', '核心', '其他'];
  const WEEKDAY = ['一', '二', '三', '四', '五', '六', '日'];
  const REST_OPTIONS = [60, 90, 120, 180, 0];
  const STEP_OPTIONS = [2.5, 5, 1, 1.25];

  const DEFAULT_EXERCISES = [
    ['深蹲', '腿'], ['硬舉', '背'], ['臥推', '胸'], ['肩推', '肩'],
    ['槓鈴划船', '背'], ['引體向上', '背'], ['滑輪下拉', '背'], ['坐姿划船', '背'],
    ['上斜啞鈴臥推', '胸'], ['啞鈴飛鳥', '胸'], ['雙槓撐體', '胸'],
    ['腿推', '腿'], ['羅馬尼亞硬舉', '腿'], ['弓箭步', '腿'], ['腿屈伸', '腿'], ['腿彎舉', '腿'],
    ['臀推', '臀'], ['側平舉', '肩'], ['臉拉', '肩'],
    ['二頭彎舉', '手臂'], ['錘式彎舉', '手臂'], ['三頭下壓', '手臂'], ['過頭三頭伸展', '手臂'],
    ['棒式', '核心'], ['懸垂舉腿', '核心']
  ];
  const DEFAULT_ROUTINES = [
    ['推日（胸・肩・三頭）', [['臥推', 4, 8], ['肩推', 3, 8], ['上斜啞鈴臥推', 3, 10], ['側平舉', 3, 15], ['三頭下壓', 3, 12]]],
    ['拉日（背・二頭）', [['硬舉', 3, 5], ['引體向上', 3, 8], ['槓鈴划船', 3, 10], ['臉拉', 3, 15], ['二頭彎舉', 3, 12]]],
    ['腿日', [['深蹲', 4, 6], ['羅馬尼亞硬舉', 3, 10], ['腿推', 3, 12], ['腿彎舉', 3, 12], ['臀推', 3, 10]]]
  ];

  // 內建課表：每個 key 只會自動加入一次，使用者刪掉就不會再出現
  const BUILTIN_ROUTINES = {
    shoulder100: {
      name: '100 次肩部訓練',
      note: '每個動作先做 1 組啟動組（用 12 下就力竭的重量），接著同重量換變化式，用暫停休息湊滿 20 下有效次數。動作之間休息 3–5 分鐘。',
      restAfter: 240,
      items: [
        ['肩推', '啟動組：啞鈴／槓鈴過頭推舉 → 接著借力推舉'],
        ['側平舉', '啟動組：啞鈴側平舉 → 接著靜態保持側平舉'],
        ['啞鈴抱髖側平舉', '啟動組後同動作，暫停休息湊 20 下'],
        ['繩索拉伸前平舉', '啟動組後同動作，暫停休息湊 20 下'],
        ['臉拉', '啟動組：舉過頭頂的臉拉 → 接著傳統臉拉']
      ]
    },
    rearSuperset: {
      name: '中後束超級組（收尾）',
      after: '100 次肩部訓練',
      note: '凳子調到約 70 度，胸口趴在椅背上，拿一對不用很重的啞鈴。兩個動作連著做算一輪，中間不休息；全程肩胛骨打開、不後縮，專練中後束。',
      restAfter: 0,
      items: [
        { name: '上斜俯身側前平舉', sets: 3, reps: 10, rest: 60, ss: 'A', note: '把啞鈴往側前方甩出去，手臂微彎，肩胛骨不後縮' },
        { name: '上斜俯身後束划船', sets: 3, reps: 10, rest: 60, ss: 'A', note: '肩胛骨保持打開不後縮，手肘往外帶，做 10 下' }
      ]
    },
    interval6: {
      name: '6 分鐘啞鈴肩部間歇',
      after: '中後束超級組（收尾）',
      note: '6 個動作各做 50 秒、休息 10 秒，一輪 6 分鐘不停。做 3–4 輪就是完整的啞鈴肩部訓練，也可以只做 1 輪，當肩部日的收尾。',
      restAfter: 60,
      interval: { work: 50, rest: 10, roundRest: 60 },
      items: [
        { name: '站姿交替肩推', sets: 3, reps: 0, note: '左右手輪流往上推' },
        { name: '錘式前平舉＋掌心向前切片', sets: 3, reps: 0, note: '錘式握法前平舉，接著掌心向前做切片動作' },
        { name: '屈臂側平舉＋空中潛水', sets: 3, reps: 0, note: '手肘彎著側平舉，接著做空中潛水的組合' },
        { name: '俯身反向飛鳥＋反握前平舉', sets: 3, reps: 0, note: '身體前傾做反向飛鳥，接著反握前平舉' },
        { name: '坐姿 Z 字阿諾推舉', sets: 3, reps: 0, note: 'Z 字推舉姿勢：坐在地上、雙腿伸直，不靠背' },
        { name: '坐姿 Z 字錘式側脈衝', sets: 3, reps: 0, note: '同樣坐姿，啞鈴錘式握法往側邊小幅度快速脈衝' }
      ]
    }
  };

  let state = { exercises: [], routines: [], workouts: [], active: null, builtins: [] };
  let prefs = { view: 'train', theme: null, palette: 'harbor', rest: 90, step: 2.5, part: '' };
  const PALETTES = { harbor: '緋紅＋深海', navy: '海軍藍＋珊瑚', forest: '森林綠＋杏桃', grape: '葡萄紫＋蜜桃', teal: '湖水青＋琥珀', sunset: '橘子汽水＋薰衣草', red: '紅＋炭黑' };
  let viewer = { name: '', avatarUrl: '' };
  let toastTimer = null;
  let tickTimer = null;
  let audioCtx = null;

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : 0; };
  const fmt = (n) => (Math.round(n * 100) / 100).toString();
  const fmtBig = (n) => Math.round(n).toLocaleString('zh-TW');

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function todayIso() { return isoOf(new Date()); }
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function clock(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
  }
  function mins(ms) { return Math.max(1, Math.round(ms / 60000)); }
  function dateLabel(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()}（${WEEKDAY[(d.getDay() + 6) % 7]}）`;
  }

  /* ---------- 計算 ---------- */
  // Epley 公式估算單次最大重量；只做 1 下就是本身
  function e1rm(w, r) { return r <= 1 ? w : w * (1 + r / 30); }
  function setVolume(s) { return s.w * s.r; }
  function workoutVolume(wk) {
    return wk.items.reduce((sum, it) => sum + it.sets.filter((s) => s.done).reduce((a, s) => a + setVolume(s), 0), 0);
  }
  function workoutSets(wk) { return wk.items.reduce((n, it) => n + it.sets.filter((s) => s.done).length, 0); }
  function bestOf(sets) {
    let best = null;
    for (const s of sets) {
      if (!s.done || !(s.r > 0)) continue;
      const v = e1rm(s.w, s.r);
      if (!best || v > best.e) best = { e: v, w: s.w, r: s.r };
    }
    return best;
  }
  function sortedWorkouts() { return state.workouts.slice().sort((a, b) => b.start - a.start); }

  function exById(id) { return state.exercises.find((e) => e.id === id); }
  function exName(id) { const e = exById(id); return e ? e.name : '（已刪除的動作）'; }

  // 某動作最近一次有做完的紀錄
  function lastFor(exId) {
    for (const wk of sortedWorkouts()) {
      const it = wk.items.find((i) => i.exId === exId && i.sets.some((s) => s.done));
      if (it) return { workout: wk, item: it, sets: it.sets.filter((s) => s.done) };
    }
    return null;
  }

  // 某動作在所有紀錄裡的最佳成績（可排除某次訓練，用來判斷是否破紀錄）
  function recordFor(exId, excludeId) {
    let bestE = null;
    let maxW = 0;
    for (const wk of state.workouts) {
      if (wk.id === excludeId) continue;
      for (const it of wk.items) {
        if (it.exId !== exId) continue;
        const b = bestOf(it.sets);
        if (b && (!bestE || b.e > bestE.e)) bestE = b;
        for (const s of it.sets) if (s.done && s.w > maxW) maxW = s.w;
      }
    }
    return { best: bestE, maxW };
  }

  function lastSummary(last) {
    if (!last) return '第一次做這個動作';
    const sets = last.sets;
    const sameW = sets.every((s) => s.w === sets[0].w);
    const body = sameW
      ? `${fmt(sets[0].w)}kg × ${sets.map((s) => s.r).join('、')}`
      : sets.map((s) => `${fmt(s.w)}×${s.r}`).join('、');
    return `上次 ${dateLabel(last.workout.start)}：${body}`;
  }

  // 暫停休息（rest-pause）：第一組是啟動組，之後的小組加總要湊滿 rp 下
  function rpDone(it) { return it.sets.reduce((n, s, i) => n + (i > 0 && s.done ? s.r : 0), 0); }
  function rpMet(it) { return !!it.rp && it.sets.length > 0 && it.sets[0].done && rpDone(it) >= it.rp; }
  // 超級組：同一個 ss 的動作輪流做，一輪做完才休息
  function ssGroup(it) { return it.ss ? state.active.items.filter((x) => x.ss === it.ss) : [it]; }
  function splitReps(total, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(Math.floor(total / n) + (i < total % n ? 1 : 0));
    return out;
  }

  // 漸進超負荷：上次每組都達標，今天建議加重
  function suggestion(exId, target) {
    const last = lastFor(exId);
    if (!last) return { last, weight: target.weight || 0, bump: false };
    if (target.rp) {
      // 啟動組做超過目標次數才力竭 → 重量太輕
      const act = last.item.sets[0];
      const goal = target.reps || 12;
      const hit = act && act.w > 0 && act.r > goal;
      return { last, weight: act ? (hit ? act.w + prefs.step : act.w) : (target.weight || 0), bump: !!hit };
    }
    const top = Math.max(...last.sets.map((s) => s.w));
    const goal = target.reps || last.item.target || 0;
    const hit = goal > 0 && last.sets.length >= (target.sets || 1) && last.sets.every((s) => s.r >= goal);
    return { last, weight: hit && top > 0 ? top + prefs.step : top, bump: hit && top > 0 };
  }

  /* ---------- 儲存 ----------
     主資料存在帳號底下的私人資料庫（data/users/<id>/）：
       meta        動作庫、課表、進行中的訓練
       m-YYYY-MM   當月的訓練紀錄（一個月一份，避免文件數暴增）
     瀏覽器 localStorage 只當快取：先畫出畫面、雲端不可用時也能用。 */
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (err) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (err) { /* 私密視窗等情況 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (err) { /* 略過 */ } }
  };
  let cloud = null;          // { coll }：雲端可用時才有
  let pulled = false;        // 第一次從雲端讀完了沒
  let dirtyBeforePull = false;
  let metaTimer = null;
  const chains = {};

  function cleanState(raw) {
    return {
      exercises: Array.isArray(raw.exercises) ? raw.exercises : [],
      routines: Array.isArray(raw.routines) ? raw.routines : [],
      workouts: Array.isArray(raw.workouts) ? raw.workouts : [],
      active: raw.active || null,
      builtins: Array.isArray(raw.builtins) ? raw.builtins : []
    };
  }
  // 把還沒加過的內建課表補進來；回傳有沒有變動
  function ensureBuiltins() {
    let changed = false;
    for (const [key, def] of Object.entries(BUILTIN_ROUTINES)) {
      if (state.builtins.includes(key)) continue;
      state.builtins.push(key);
      changed = true;
      if (state.routines.some((x) => x.name === def.name)) continue;
      const routine = {
        id: uid(), name: def.name, note: def.note, restAfter: def.restAfter, interval: def.interval || null,
        items: def.items.map((d) => (Array.isArray(d)
          ? { exId: findOrCreateEx(d[0], '肩').id, sets: 4, reps: 12, weight: 0, rp: 20, rest: 15, note: d[1] }
          : { exId: findOrCreateEx(d.name, '肩').id, sets: d.sets, reps: d.reps, weight: 0, rest: d.rest, ss: d.ss, note: d.note }))
      };
      const at = def.after ? state.routines.findIndex((x) => x.name === def.after) : -1;
      if (at >= 0) state.routines.splice(at + 1, 0, routine); else state.routines.unshift(routine);
    }
    return changed;
  }
  function load() {
    let raw = null;
    try { raw = JSON.parse(LS.get(STORE_KEY) || 'null'); } catch (err) { raw = null; }
    if (raw && Array.isArray(raw.exercises) && raw.exercises.length) state = cleanState(raw);
    else seed();
    if (ensureBuiltins()) LS.set(STORE_KEY, JSON.stringify(state));
    try { Object.assign(prefs, JSON.parse(LS.get(PREF_KEY) || '{}')); } catch (err) { /* 用預設 */ }
    // 新增「緋紅＋深海」時讓既有使用者先看一次，之後照自己的選擇
    if (!prefs.paletteSeen || prefs.paletteSeen < 2) { prefs.palette = 'harbor'; prefs.paletteSeen = 2; savePrefs(); }
    if (!VIEWS.includes(prefs.view)) prefs.view = 'train';
  }
  function seed() {
    state = { exercises: [], routines: [], workouts: [], active: null, builtins: [] };
    for (const [name, part] of DEFAULT_EXERCISES) state.exercises.push({ id: uid(), name, part });
    for (const [name, list] of DEFAULT_ROUTINES) {
      state.routines.push({
        id: uid(), name,
        items: list.map(([n, sets, reps]) => ({ exId: findOrCreateEx(n).id, sets, reps, weight: 0 }))
      });
    }
    ensureBuiltins();
    LS.set(STORE_KEY, JSON.stringify(state));
  }

  function monthKey(ts) { const d = new Date(ts); return `m-${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }

  // save()：動作庫／課表／進行中訓練變了；save([時間戳…])：那幾個月的紀錄也變了
  function save(touchedTimes) {
    LS.set(STORE_KEY, JSON.stringify(state));
    if (!pulled) dirtyBeforePull = true;
    if (!cloud) return;
    clearTimeout(metaTimer);
    metaTimer = setTimeout(flushMeta, 700);
    for (const key of new Set((touchedTimes || []).map(monthKey))) writeMonth(key);
  }
  function chain(docId, fn) {
    chains[docId] = (chains[docId] || Promise.resolve())
      .then(fn)
      .catch((err) => new Promise((r) => setTimeout(r, 600 + Math.random() * 600)).then(() => {
        if (err && err.code === 'unavailable') return fn(); // 暫時性錯誤：重試一次
        throw err;
      }))
      .catch(cloudError);
    return chains[docId];
  }
  function flushMeta() {
    if (!cloud || !metaTimer) return;
    clearTimeout(metaTimer);
    metaTimer = null;
    chain('meta', () => cloud.coll.doc('meta').set({
      v: 1, exercises: state.exercises, routines: state.routines, active: state.active, builtins: state.builtins, updatedAt: Date.now()
    }));
  }
  function writeMonth(key) {
    chain(key, () => {
      const list = state.workouts.filter((w) => monthKey(w.start) === key);
      const ref = cloud.coll.doc(key);
      return list.length ? ref.set({ workouts: list }) : ref.delete();
    });
  }
  function writeAll() {
    metaTimer = metaTimer || 1;
    flushMeta();
    for (const key of new Set(state.workouts.map((w) => monthKey(w.start)))) writeMonth(key);
  }
  function cloudError(err) {
    const code = err && err.code;
    if (code === 'quota_exceeded') toast('雲端空間滿了：先匯出備份，再刪掉舊紀錄');
    else if (code === 'revoked' || code === 'invalid_argument' || code === 'not_granted') { cloud = null; setSync('local'); toast('無法同步到帳號，先存在這個瀏覽器'); }
    else toast('同步暫時失敗，稍後會再試');
  }

  function setSync(mode) {
    const el = $('#syncLabel');
    if (el) el.textContent = mode === 'cloud' ? '已同步到你的帳號' : mode === 'wait' ? '連線中…' : '只存在這個瀏覽器';
  }

  async function connectCloud() {
    setSync('wait');
    try {
      if (!window.claude || typeof window.claude.use !== 'function') throw new Error('no-runtime');
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) throw new Error('no-db');
      cloud = { coll: db.collection('data/users/' + id) };
      user.me().then((m) => { viewer = m || viewer; renderAvatar(); if (prefs.view === 'train' && !state.active) renderTrain(); }).catch(() => {});
      await pull(true);
    } catch (err) {
      cloud = null;
      pulled = true;
      setSync('local');
    }
  }

  async function pull(first) {
    if (!cloud) return;
    const snap = await cloud.coll.get();
    let meta = null;
    const workouts = [];
    for (const d of snap.docs) {
      const body = JSON.parse(JSON.stringify(d.data() || {}));
      if (d.id === 'meta') meta = body;
      else if (d.id.startsWith('m-') && Array.isArray(body.workouts)) workouts.push(...body.workouts);
    }
    const cloudEmpty = !meta && !workouts.length;
    if (first && (cloudEmpty || dirtyBeforePull)) {
      // 雲端還沒資料（或剛剛已經在本機動過）：以本機為主，合併後整份寫上去
      for (const w of workouts) if (!state.workouts.some((x) => x.id === w.id)) state.workouts.push(w);
      pulled = true;
      LS.set(STORE_KEY, JSON.stringify(state));
      writeAll();
    } else if (!cloudEmpty) {
      state = cleanState({ ...(meta || {}), workouts });
      if (!state.exercises.length) seed();
      pulled = true;
      if (ensureBuiltins()) save();
      LS.set(STORE_KEY, JSON.stringify(state));
    }
    pulled = true;
    setSync('cloud');
    render();
  }

  function savePrefs() { LS.set(PREF_KEY, JSON.stringify(prefs)); }

  /* ---------- 頁內確認框（檢視器不支援 confirm／prompt） ---------- */
  function ask(text, okLabel, danger) {
    return new Promise((resolve) => {
      const dlg = $('#askDialog');
      $('#askText').textContent = text;
      const ok = $('#askOk');
      ok.textContent = okLabel || '確定';
      ok.className = `btn ${danger ? 'btn--danger' : 'btn--primary'}`;
      const done = (v) => { dlg.onclose = null; if (dlg.open) dlg.close(); resolve(v); };
      ok.onclick = () => done(true);
      $('#askCancel').onclick = () => done(false);
      dlg.onclose = () => resolve(false);
      dlg.showModal();
    });
  }

  function findOrCreateEx(name, part) {
    const clean = name.trim();
    let ex = state.exercises.find((e) => e.name === clean);
    if (!ex) { ex = { id: uid(), name: clean, part: part || '其他' }; state.exercises.push(ex); }
    return ex;
  }

  /* ---------- 訓練流程 ---------- */
  function makeItem(exId, target, ssPrefix) {
    const t = target || {};
    const ss = t.ss ? (ssPrefix || 'w') + ':' + String(t.ss).replace(/^.*:/, '') : '';
    const sug = suggestion(exId, t);
    if (t.rp) {
      const w = sug.weight || t.weight || 0;
      const minis = splitReps(t.rp, Math.max(1, (t.sets || 4) - 1));
      return {
        exId, target: t.reps || 12, rp: t.rp, rest: t.rest || 15, note: t.note || '', bump: sug.bump,
        sets: [{ w, r: t.reps || 12, done: false }].concat(minis.map((n) => ({ w, r: n, done: false })))
      };
    }
    const lastSets = sug.last ? sug.last.sets : [];
    const count = t.sets || lastSets.length || 3;
    const sets = [];
    for (let i = 0; i < count; i++) {
      const ref = lastSets[i] || lastSets[lastSets.length - 1];
      sets.push({
        w: t.sets ? (sug.weight || t.weight || 0) : (ref ? ref.w : 0),
        r: t.reps || (ref ? ref.r : 8),
        done: false
      });
    }
    return { exId, target: t.reps || 0, rest: t.rest || 0, ss, note: t.note || '', bump: !!(t.sets && sug.bump), sets };
  }

  function startWorkout(routine, copyFrom) {
    if (state.active) { toast('已經有一場訓練在進行'); goto('train'); return; }
    let items = [];
    let name = '自由訓練';
    if (routine) {
      name = routine.name;
      items = routine.items.filter((it) => exById(it.exId)).map((it) => makeItem(it.exId, it));
    } else if (copyFrom) {
      name = copyFrom.name;
      items = copyFrom.items.map((it) => makeItem(it.exId, { sets: it.sets.length, reps: it.target || 0, rp: it.rp || 0, rest: it.rest || 0, ss: it.ss || '', note: it.note || '' }));
    }
    const src = routine || copyFrom || {};
    const interval = src.interval && src.interval.work > 0 ? { ...src.interval } : null;
    if (interval) items.forEach((it) => it.sets.forEach((x) => { if (!x.done) x.r = 0; }));
    state.active = {
      id: uid(), name, routineId: routine ? routine.id : (copyFrom ? copyFrom.routineId : null), start: Date.now(), items,
      note: src.note || '', restAfter: src.restAfter || 0, interval,
      iv: interval ? { phase: 'ready', idx: 0, round: 0, running: false, endAt: 0, left: interval.work * 1000 } : null
    };
    save();
    goto('train');
    toast('開始訓練，加油');
  }

  async function finishWorkout() {
    const wk = state.active;
    if (!wk) return;
    const items = wk.items
      .map((it) => ({ ...it, sets: it.sets.filter((s) => s.done) }))
      .filter((it) => it.sets.length);
    if (!items.length) {
      if (await ask('一組都還沒打勾。要放棄這場訓練嗎？', '放棄訓練', true)) discardWorkout(true);
      return;
    }
    // 暫停休息已湊滿的動作，剩下沒勾的小組不算漏做
    const undone = wk.items.reduce((n, it) => n + (rpMet(it) ? 0 : it.sets.filter((x) => !x.done).length), 0);
    if (undone > 0 && !(await ask(`還有 ${undone} 組沒打勾，沒勾的不會記錄。確定完成？`, '完成訓練'))) return;
    if (state.active !== wk) return;

    const done = { id: wk.id, name: wk.name, routineId: wk.routineId, note: wk.note || '', restAfter: wk.restAfter || 0, interval: wk.interval || null, start: wk.start, end: Date.now(), items };
    releaseWake();
    const prs = [];
    for (const it of items) {
      const before = recordFor(it.exId, done.id);
      const now = bestOf(it.sets);
      if (now && before.best && now.e > before.best.e + 0.01) prs.push({ exId: it.exId, now, before: before.best });
    }
    done.prs = prs.map((p) => p.exId);
    state.workouts.push(done);
    state.active = null;
    save([done.start]);
    stopRest();
    render();
    showSummary(done, prs);
  }
  function workoutSetsAll(wk) { return wk.items.reduce((n, it) => n + it.sets.length, 0); }

  async function discardWorkout(skipConfirm) {
    if (!state.active) return;
    if (!skipConfirm && !(await ask('放棄這場訓練？這場的紀錄不會保存。', '放棄訓練', true))) return;
    state.active = null;
    save();
    stopRest();
    releaseWake();
    render();
    toast('已放棄');
  }

  function toggleSet(ii, si) {
    const it = state.active.items[ii];
    const s = it.sets[si];
    s.done = !s.done;
    if (s.done && state.active.interval) { buzz(25); sfx('tick'); save(); renderTrain(); return; }
    if (s.done) {
      if (!(s.r > 0)) s.r = it.target || 1;
      buzz(25);
      sfx('tick');
      // 暫停休息全勾完還沒湊滿：自動補一小組
      if (it.rp && it.sets.every((y) => y.done) && rpDone(it) < it.rp) {
        const left = it.rp - rpDone(it);
        it.sets.push({ w: s.w, r: left, done: false });
        toast(`還差 ${left} 下，再來一小組`);
      } else if (it.rp && rpMet(it) && si > 0) {
        toast(`${it.rp} 下達成！`);
      }
      const exDone = (x) => x.sets.every((y) => y.done) || rpMet(x);
      const isLast = state.active.items.every(exDone);
      const group = ssGroup(it);
      const partner = group.length > 1 ? group.slice(group.indexOf(it) + 1).concat(group.slice(0, group.indexOf(it))).find((x) => x.sets[si] && !x.sets[si].done) : null;
      if (isLast) { stopRest(); toast('全部完成！按「完成訓練」存檔'); }
      else if (partner) {
        // 超級組：這一輪還沒做完，不休息，直接接下一個動作
        stopRest();
        toast(`不休息，接著做「${exName(partner.exId)}」`);
        save();
        renderTrain();
        const card = document.querySelector(`.ex[data-ii="${state.active.items.indexOf(partner)}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      } else if (prefs.rest > 0) {
        if (group.every(exDone)) startRest(state.active.restAfter || prefs.rest, '換下一個動作', true);
        else startRest(it.rest || prefs.rest, it.rp ? '暫停休息，深呼吸' : group.length > 1 ? '這輪做完，休息一下' : '組間休息');
      }
    }
    save();
    renderTrain();
  }

  /* ---------- 間歇計時（做 N 秒、休 M 秒，自動換動作） ---------- */
  const IV_LABEL = { ready: '準備', work: '做！', rest: '休息', round: '輪間休息', done: '完成' };
  let wakeLock = null;
  let lastBeep = -1;
  function ivRounds(wk) { return Math.max(1, ...wk.items.map((it) => it.sets.length)); }
  function ivDur(wk, phase) {
    const c = wk.interval;
    return (phase === 'work' || phase === 'ready' ? c.work : phase === 'rest' ? c.rest : phase === 'round' ? c.roundRest : 0) * 1000;
  }
  async function holdWake() { try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) { wakeLock = null; } }
  function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (err) { /* 略過 */ } wakeLock = null; }

  function ivToggle() {
    const wk = state.active, iv = wk.iv;
    if (iv.phase === 'done') return;
    if (iv.running) {
      iv.running = false;
      iv.left = Math.max(0, iv.endAt - Date.now());
      releaseWake();
    } else {
      if (iv.phase === 'ready') { iv.phase = 'work'; sfx('go'); }
      iv.running = true;
      iv.endAt = Date.now() + iv.left;
      holdWake();
    }
    save();
    renderTrain();
  }
  function ivSkip() {
    const iv = state.active.iv;
    if (iv.phase === 'done') return;
    if (iv.phase === 'ready') iv.phase = 'work';
    iv.running = true;
    iv.endAt = Date.now();
    holdWake();
    ivTick();
  }

  // 一段結束：工作段結束就把那一組打勾，然後進到下一段
  function ivAdvance(quiet) {
    const wk = state.active, iv = wk.iv;
    const n = wk.items.length, rounds = ivRounds(wk);
    if (iv.phase === 'work') {
      const s = wk.items[iv.idx] && wk.items[iv.idx].sets[iv.round];
      if (s) s.done = true;
      if (iv.idx >= n - 1 && iv.round >= rounds - 1) {
        iv.phase = 'done';
        iv.running = false;
        releaseWake();
        sfx('pr'); buzz([200, 100, 200, 100, 300]);
        toast('間歇全部完成！按「完成訓練」存檔');
        return false;
      }
      iv.phase = iv.idx >= n - 1 ? 'round' : 'rest';
      if (!quiet) { sfx('ding'); buzz(200); }
    } else {
      if (iv.phase === 'round') { iv.round++; iv.idx = 0; } else iv.idx++;
      iv.phase = 'work';
      if (!quiet) { sfx('go'); buzz([100, 60, 100]); }
    }
    iv.endAt += ivDur(wk, iv.phase);
    return true;
  }

  function ivTick() {
    const wk = state.active;
    if (!wk || !wk.interval || !wk.iv) return;
    const iv = wk.iv;
    const now = Date.now();
    let changed = false;
    if (iv.running) {
      for (let guard = 0; guard < 200 && iv.running && now >= iv.endAt; guard++) {
        changed = true;
        if (!ivAdvance(now - iv.endAt > 2000)) break;
      }
    }
    if (changed) { lastBeep = -1; save(); renderTrain(); return; }
    const left = iv.running ? iv.endAt - now : iv.left;
    const dur = ivDur(wk, iv.phase) || 1;
    const sec = Math.ceil(left / 1000);
    if (iv.running && sec <= 3 && sec >= 1 && sec !== lastBeep) { lastBeep = sec; sfx('beep'); }
    const t = document.getElementById('ivTime');
    if (t) t.textContent = iv.phase === 'done' ? '0:00' : clock(left);
    const bar = document.getElementById('ivBar');
    if (bar) bar.style.width = `${iv.phase === 'done' ? 100 : Math.min(100, Math.max(0, (1 - left / dur) * 100))}%`;
  }

  function ivHtml(wk) {
    const iv = wk.iv, n = wk.items.length, rounds = ivRounds(wk);
    const name = (i) => (wk.items[i] ? exName(wk.items[i].exId) : '');
    let now = '', next = '';
    if (iv.phase === 'ready') { now = name(0); next = `按開始，先做 ${wk.interval.work} 秒`; }
    else if (iv.phase === 'work') {
      now = name(iv.idx);
      next = iv.idx < n - 1 ? `接下來：${name(iv.idx + 1)}` : iv.round < rounds - 1 ? `接下來：輪間休息 ${wk.interval.roundRest} 秒` : '最後一個動作，撐住！';
    } else if (iv.phase === 'rest') { now = `下一個：${name(iv.idx + 1)}`; next = '喘口氣，準備好啞鈴'; }
    else if (iv.phase === 'round') { now = `第 ${iv.round + 2} 輪從「${name(0)}」開始`; next = '喝口水'; }
    else { now = `${rounds} 輪全部完成`; next = '可以填上每組做了幾下，再按完成訓練'; }
    const isRest = iv.phase === 'rest' || iv.phase === 'round';
    const left = iv.running ? iv.endAt - Date.now() : iv.left;
    return `
      <section class="iv" aria-label="間歇計時">
        <div class="iv__top">
          <span class="iv__phase${isRest ? ' is-rest' : ''}">${IV_LABEL[iv.phase]}</span>
          <span class="iv__round">第 ${Math.min(iv.round + 1, rounds)} / ${rounds} 輪 · 動作 ${Math.min(iv.idx + 1, n)} / ${n}</span>
        </div>
        <div class="iv__time" id="ivTime">${iv.phase === 'done' ? '0:00' : clock(left)}</div>
        <p class="iv__now">${esc(now)}</p>
        <p class="iv__next">${esc(next)}</p>
        <div class="iv__bar"><i id="ivBar"></i></div>
        ${iv.phase === 'done' ? '' : `<div class="iv__actions">
          <button type="button" class="btn btn--primary" data-act="iv-toggle"><svg class="ico"><use href="#${iv.running ? 'i-pause' : 'i-play'}"/></svg>${iv.running ? '暫停' : iv.phase === 'ready' ? '開始' : '繼續'}</button>
          <button type="button" class="btn" data-act="iv-skip"><svg class="ico"><use href="#i-skip"/></svg>跳過這段</button>
        </div>`}
      </section>`;
  }

  /* ---------- 休息計時 ---------- */
  let restMem = null; // localStorage 不能用時的備援
  function restState() { try { return JSON.parse(LS.get(REST_KEY) || 'null') || restMem; } catch (err) { return restMem; } }
  function putRest(r) { restMem = r; LS.set(REST_KEY, JSON.stringify(r)); }
  function startRest(sec, label, next) {
    putRest({ end: Date.now() + sec * 1000, total: sec * 1000, rang: false, label: label || '休息中', next: !!next });
    tick();
  }
  function stopRest() { restMem = null; LS.del(REST_KEY); $('#rest').hidden = true; }
  function adjustRest(deltaSec) {
    const r = restState();
    if (!r) return;
    r.end = Math.max(Date.now(), r.end + deltaSec * 1000);
    r.total = Math.max(r.total + deltaSec * 1000, 1000);
    r.rang = false;
    putRest(r);
    tick();
  }

  function tick() {
    // 進行中訓練的經過時間
    if (state.active) {
      const t = document.getElementById('liveTime');
      if (t) t.textContent = clock(Date.now() - state.active.start);
      ivTick();
    }
    const r = restState();
    const bar = $('#rest');
    if (!r || !state.active) { bar.hidden = true; return; }
    const left = r.end - Date.now();
    bar.hidden = false;
    if (left <= 0) {
      bar.classList.add('is-over');
      $('#restTime').textContent = '0:00';
      $('#restText').textContent = r.next ? '休息結束，開始下一個動作！' : '休息結束，下一組！';
      $('#restFill').style.width = '100%';
      if (!r.rang) {
        r.rang = true;
        putRest(r);
        buzz([200, 100, 200]);
        sfx('ding');
      }
      if (left < -15000) stopRest(); // 響完 15 秒自動收起
      return;
    }
    bar.classList.remove('is-over');
    $('#restTime').textContent = clock(left);
    $('#restText').textContent = r.label || '休息中';
    $('#restFill').style.width = `${Math.min(100, (1 - left / r.total) * 100)}%`;
  }

  function buzz(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (err) { /* 不支援 */ } }
  function sfx(kind) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const notes = kind === 'ding' ? [[880, 0], [1175, 0.16], [1568, 0.32]] : kind === 'pr' ? [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.3]]
        : kind === 'go' ? [[784, 0], [1175, 0.12]] : kind === 'beep' ? [[988, 0]] : [[660, 0]];
      for (const [f, at] of notes) {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + at);
        g.gain.exponentialRampToValueAtTime(kind === 'tick' ? 0.08 : 0.18, now + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + at + (kind === 'tick' ? 0.12 : 0.35));
        o.connect(g).connect(audioCtx.destination);
        o.start(now + at);
        o.stop(now + at + 0.4);
      }
    } catch (err) { /* 沒聲音也沒關係 */ }
  }

  /* ---------- 畫面：共用 ---------- */
  function goto(view) {
    prefs.view = view;
    savePrefs();
    render();
    window.scrollTo({ top: 0 });
  }

  function render() {
    for (const v of VIEWS) {
      const el = document.getElementById('view' + v[0].toUpperCase() + v.slice(1));
      el.hidden = v !== prefs.view;
    }
    document.querySelectorAll('.nav__btn').forEach((b) => {
      const on = b.dataset.view === prefs.view;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    $('#navDot').hidden = !state.active;
    $('#restLabel').textContent = prefs.rest ? `休息：${prefs.rest} 秒` : '休息計時：關';
    $('#stepLabel').textContent = `加重：${fmt(prefs.step)} kg`;
    if (prefs.view === 'train') renderTrain();
    if (prefs.view === 'routines') renderRoutines();
    if (prefs.view === 'log') renderLog();
    if (prefs.view === 'progress') renderProgress();
    tick();
  }

  function weekInfo() {
    const mon = mondayOf(new Date());
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      days.push(isoOf(d));
    }
    const thisWeek = state.workouts.filter((w) => w.start >= mon.getTime());
    const lastWeek = state.workouts.filter((w) => w.start >= mon.getTime() - 7 * 86400000 && w.start < mon.getTime());
    const trained = new Set(thisWeek.map((w) => isoOf(new Date(w.start))));
    // 連續幾週都有練（本週還沒練不算斷）
    let streak = 0;
    const cursor = new Date(mon);
    if (!thisWeek.length) cursor.setDate(cursor.getDate() - 7);
    for (;;) {
      const from = cursor.getTime();
      const to = from + 7 * 86400000;
      if (!state.workouts.some((w) => w.start >= from && w.start < to)) break;
      streak++;
      cursor.setDate(cursor.getDate() - 7);
    }
    return { days, trained, thisWeek, lastWeek, streak };
  }

  /* ---------- 畫面：訓練 ---------- */
  function renderTrain() {
    const el = $('#viewTrain');
    if (state.active) { el.innerHTML = activeHtml(); bindActive(el); return; }

    const wi = weekInfo();
    const today = todayIso();
    const last = sortedWorkouts()[0];
