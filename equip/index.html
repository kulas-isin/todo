<style>
/* Layout: one phone-width column of chunky game-UI panels over a faint pixel grid; floating tab dock at the bottom. */
:root {
  color-scheme: dark;
  --bg: #0F1218; --grid: rgba(255,255,255,.035); --card: #171C24; --surface: #1E2430; --soft: #262E3B; --line: #2C3442;
  --ink: #E8EDF2; --muted: #93A0B0;
  --accent: #39D0D8; --btn: #39D0D8; --btn-hi: #6EE2E8; --on-btn: #06272A; --glow: rgba(0,0,0,.35);
  --danger-bg: #3A1E25; --danger: #FF8A98; --neg: #FF7A88; --pos: #5FE0A8;
  --loot-bg: #3A3216; --loot: #F4CF6A; --banner-bg: #2A2716; --banner: #F1DA8F;
  --r-common: #9AA6B2; --r-rare: #4EA8F5; --r-epic: #B48CF2; --r-legend: #F2B84B;
  --ok: #4FD69C; --warn: #F5A524; --bad: #FF6B7D;
  --f-display: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --f-num: "Silkscreen", ui-monospace, monospace;
  --f-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, monospace;
}
[data-palette="graphite"] { --bg: #111111; --card: #1A1A1A; --surface: #222222; --soft: #2C2C2C; --line: #353535; --ink: #EDEDED; --muted: #A3A3A3; --accent: #F5A524; --btn: #F5A524; --btn-hi: #FFC25C; --on-btn: #2B1A00; }
[data-palette="neon"] { --bg: #110F1A; --card: #191626; --surface: #211D31; --soft: #2B263F; --line: #332D4A; --ink: #ECE9F7; --muted: #A49DBF; --accent: #A78BFA; --btn: #A78BFA; --btn-hi: #C4B5FD; --on-btn: #1E1340; }
[data-palette="frost"] { color-scheme: light; --bg: #EEF1F5; --grid: rgba(0,0,0,.045); --card: #FFFFFF; --surface: #FFFFFF; --soft: #E3E8EF; --line: #D5DCE5; --ink: #18202B; --muted: #556273; --accent: #2D6CDF; --btn: #2D6CDF; --btn-hi: #4A86F0; --on-btn: #FFFFFF; --glow: rgba(20,30,50,.12); --danger-bg: #FDE8EB; --danger: #A3192F; --neg: #B2263D; --pos: #157A55; --loot-bg: #FFF1CC; --loot: #6E4A00; --banner-bg: #FFF4D6; --banner: #5F4300; --ok: #1FA36B; --warn: #D9820B; --bad: #E0445A; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-attachment: fixed; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 150px; display: flex; flex-direction: column; gap: 18px; }

h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 16px; }
h3 { font-size: 15px; }
.num { font-family: var(--f-num); font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--f-pixel); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 8px 24px var(--glow); color: var(--ink); }
.puff { border: 1px solid var(--line); border-radius: 12px; min-height: 46px; padding: 0 18px; background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0,0,0,.28); transition: transform .1s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.puff:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.28); }
.puff.primary { border-color: transparent; background: var(--btn); color: var(--on-btn); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 0 18px color-mix(in srgb, var(--accent) 25%, transparent); }
.puff.soft { background: var(--soft); }
.puff.danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.puff.sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 2px; min-height: 36px; }

.gold-total { font-size: 32px; line-height: 1.1; }
.mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; }
.mini .num { font-size: 17px; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tiles.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 0; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rc) 75%, transparent), inset 0 -3px 0 rgba(0,0,0,.25); transition: transform .1s; }
.tile:active { transform: scale(.96); }
.glyph { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 21px; color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 75%, #fff), color-mix(in srgb, var(--rc) 80%, #000)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.35); flex: none; }
.four .glyph { width: 38px; height: 38px; font-size: 17px; }
.tname { font-size: 12.5px; font-weight: 500; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot { font-family: var(--f-pixel); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
.qty { position: absolute; top: 5px; right: 8px; font-size: 11px; color: var(--muted); }
.bar { display: block; width: 100%; height: 8px; background: var(--soft); overflow: hidden; }
.bar > span { display: block; height: 100%; }
.tile .bar { width: 80%; height: 6px; }
.bar.px { -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 7px); }
.sprite { display: block; shape-rendering: crispEdges; flex: none; }
.pxlabel { font-family: var(--f-pixel); font-size: 11px; letter-spacing: .04em; }
.glyph.photo { background: color-mix(in srgb, var(--rc) 14%, var(--soft)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--rc) 55%, transparent); }
.glyph.photo img { width: 86%; height: 86%; object-fit: contain; display: block; }
.glyph.photo.pix img { image-rendering: pixelated; }
.photo-box { display: flex; gap: 14px; align-items: center; }
.photo-cv { width: 132px; height: 132px; border-radius: 12px; flex: none; background-color: var(--surface); background-image: linear-gradient(45deg, var(--soft) 25%, transparent 25%, transparent 75%, var(--soft) 75%), linear-gradient(45deg, var(--soft) 25%, transparent 25%, transparent 75%, var(--soft) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; border: 1px solid var(--line); image-rendering: pixelated; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty-slot { border: 2px dashed var(--line); border-radius: 12px; min-height: 104px; display: grid; place-items: center; color: var(--muted); font-size: 12px; background: transparent; }

.alert { display: flex; align-items: center; gap: 12px; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); width: 100%; text-align: left; }
.alert .glyph { width: 40px; height: 40px; font-size: 17px; }
.alert-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); min-height: 38px; padding: 0 16px; border-radius: 10px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--on-btn); border-color: transparent; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--soft); }
.dot { width: 9px; height: 9px; background: var(--rc); display: inline-block; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; min-height: 46px; color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }

.pouches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pouch { border: 1px solid var(--line); text-align: left; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); min-width: 0; }
.pouch .num { font-size: 18px; }
.pouch.add { background: transparent; border: 2px dashed var(--line); box-shadow: none; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; }
.catrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 80px; align-items: center; gap: 10px; font-size: 13px; }
.catrow .bar { height: 10px; }
.catrow .bar > span { background: var(--accent); }
.catrow .num { text-align: right; font-size: 13px; }
.txday { font-family: var(--f-pixel); font-size: 11px; letter-spacing: .06em; color: var(--muted); padding: 8px 4px 2px; }
.tx { border: 0; background: transparent; color: var(--ink); width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); min-height: 52px; }
.tx-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tx .amt { font-size: 14px; }
.amt.in { color: var(--pos); }
.amt.out { color: var(--ink); }
.amt.move { color: var(--muted); }
.loot { font-family: var(--f-pixel); font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--loot-bg); color: var(--loot); white-space: nowrap; }

.hall-item { display: flex; gap: 12px; align-items: center; background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; border: 1px solid var(--line); width: 100%; text-align: left; }
.hall-item .glyph { filter: grayscale(.5); }

.banner { display: flex; align-items: center; gap: 10px; background: var(--banner-bg); color: var(--banner); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.banner span { flex: 1; }
.welcome { text-align: center; align-items: center; padding: 28px 20px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dock-inner { max-width: 448px; margin: 0 auto; position: relative; }
.tabbar { pointer-events: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 10px 30px var(--glow); }
.tab { border: 0; background: transparent; border-radius: 10px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tab[aria-current="page"] { background: var(--soft); color: var(--accent); }
.tab svg { width: 22px; height: 22px; }
.fab { pointer-events: auto; position: absolute; right: 4px; bottom: 80px; width: 60px; height: 60px; border-radius: 14px; border: 0; color: var(--on-btn); background: var(--btn); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent), 0 8px 20px var(--glow); display: grid; place-items: center; }
.fab:active { transform: scale(.95); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 90%; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
.grab { width: 44px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.x { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); display: grid; place-items: center; flex: none; }

form.stack { gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .two > input, .two > select { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 46px; padding: 0 14px; font-size: 16px; font-weight: 500; color: var(--ink); width: 100%; }
.field input[type=range] { border: 0; background: transparent; padding: 0; }
.field textarea { padding: 10px 14px; min-height: 70px; resize: vertical; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 38px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.check { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--btn); }
.hint { font-size: 12px; font-weight: 400; color: var(--muted); }

.detail-head { display: flex; gap: 14px; align-items: center; }
.detail-head .glyph { width: 76px; height: 76px; font-size: 32px; border-radius: 14px; }
.big-dur { font-size: 36px; line-height: 1; }
input[type=range] { width: 100%; accent-color: var(--btn); height: 32px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
.stat .num { font-size: 15px; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.timeline { display: flex; flex-direction: column; gap: 12px; border-left: 2px dashed var(--line); margin-left: 6px; padding-left: 16px; }
.timeline div { display: flex; flex-direction: column; }
.palettes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pal { border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; background: var(--surface); color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.pal i { width: 34px; height: 34px; border-radius: 8px; display: block; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 360px) { .tiles.four { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
</style>


<main class="app" id="view" aria-live="polite"></main>

<div class="dock">
  <div class="dock-inner">
    <button class="fab" type="button" data-act="fab" aria-label="新增">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>

      <button class="tab" type="button" data-act="tab" data-tab="hall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"></path></svg>名人堂</button>

</div>

<script>
(function () {
  var RAR = {
    common: { n: '普通', c: 'var(--r-common)' }, rare: { n: '稀有', c: 'var(--r-rare)' },
    epic: { n: '史詩', c: 'var(--r-epic)' }, legend: { n: '傳說', c: 'var(--r-legend)' }
  };
  var RAR_ORDER = { legend: 0, epic: 1, rare: 2, common: 3 };
  var KIND = { gear: '裝備', item: '消耗品', keep: '收藏' };
  var SLOTS = ['主手', '頭部', '身體', '腳部', '飾品', '背部', '口袋'];
  var OUTCATS = ['餐飲', '交通', '日用品', '裝備', '娛樂', '居家', '醫療', '其他'];
  var INCATS = ['薪水', '獎金', '賣出', '其他'];
  var UNITS = { d: 1, w: 7, m: 30, y: 365 };
  var PALETTES = [
    { k: 'night', n: '夜行', c: '#39D0D8' }, { k: 'graphite', n: '石墨', c: '#F5A524' },
    { k: 'neon', n: '霓紫', c: '#A78BFA' }, { k: 'frost', n: '冰霜', c: '#2D6CDF' }
  ];
  var COLLS = ['items', 'txs', 'pouches'];
  var LS_DATA = 'equip-data-v1', LS_PAL = 'equip-palette';

  var S = { items: {}, txs: {}, pouches: {} };
  var mode = 'loading';
  var db = null, dl = null;
  var tab = 'home', bagFilter = 'all', bagQ = '';
  var sheet = null, sheetSubmit = null;

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtD(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return fmtD(new Date()); }
  function parseD(s) { var p = String(s || today()).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
  function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
  function md(s) { var d = parseD(s); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function ymd(s) { var d = parseD(s); return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate(); }
  function money(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('en-US'); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function vals(c) { return Object.keys(S[c]).map(function (k) { return S[c][k]; }); }
  function activeItems() { return vals('items').filter(function (i) { return i.status !== 'retired'; }); }
  function rc(i) { return (RAR[i.rarity] || RAR.common).c; }
  function glyph(i) { return (i.icon || i.name || '?').trim().charAt(0) || '?'; }
  function glyphHTML(i) {
    if (i.photo) return '<span class="glyph photo' + (i.photoPixel ? ' pix' : '') + '"><img src="' + esc(i.photo) + '" alt=""></span>';
    return '<span class="glyph">' + esc(glyph(i)) + '</span>';
  }
  function pixelSVG(rows, colors, size, label) {
    var w = rows[0].length, h = rows.length, r = '';
    rows.forEach(function (row, y) { for (var x = 0; x < w; x++) { var c = colors[row.charAt(x)]; if (c) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"></rect>'; } });
    return '<svg class="sprite" width="' + size + '" height="' + Math.round(size * h / w) + '" viewBox="0 0 ' + w + ' ' + h + '"' + (label ? ' role="img" aria-label="' + label + '"' : ' aria-hidden="true"') + '>' + r + '</svg>';
  }
  var COIN = pixelSVG(['..oooo..', '.ohyyyo.', 'ohyyyyyo', 'ohyyoyyo', 'oyyyoyyo', 'oyyyyyyo', '.oyyyyo.', '..oooo..'], { o: '#A86412', y: '#F2B83E', h: '#FFE7A8' }, 30);
  function chest(sz) { return pixelSVG(['..oooooo..', '.obbbbbbo.', 'obbbbbbbbo', 'oooooyoooo', 'obbbbybbbo', 'obbbbbbbbo', 'obbbbbbbbo', 'oooooooooo'], { o: '#5B3A1E', b: '#B9772E', y: '#F5D04A' }, sz); }
  var TROPHY = pixelSVG(['yyyyyyyy', 'yhyyyyyy', '.yyyyyy.', '..yyyy..', '...yy...', '...yy...', '..oooo..', '.oooooo.'], { y: '#F2B84B', h: '#FFE7A8', o: '#8A6A2E' }, 48);
  var HEART = pixelSVG(['.rr.rr.', 'rhrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: '#E5586A', h: '#FFC2CB' }, 20);

  function autoDur(i) {
    if (!i.life) return null;
    return clamp(Math.round(100 * (1 - daysBetween(i.acquired, today()) / i.life)), 0, 100);
  }
  function dur(i) {
    if (i.durMode === 'manual' && i.manual != null) return i.manual;
    return autoDur(i);
  }
  function durColor(d) { return d == null ? 'var(--line)' : d > 50 ? 'var(--ok)' : d >= 20 ? 'var(--warn)' : 'var(--bad)'; }
  function bar(d) { return '<span class="bar px"><span style="width:' + (d == null ? 0 : d) + '%;background:' + durColor(d) + '"></span></span>'; }
  function lifeEnd(i) { return i.life ? addDays(i.acquired, i.life) : null; }
  function itemCost(i) {
    var c = Number(i.price) || 0;
    (i.log || []).forEach(function (l) { c += Number(l.cost) || 0; });
    return c;
  }
  function itemDays(i) { return Math.max(1, daysBetween(i.acquired, i.status === 'retired' && i.retiredAt ? i.retiredAt : today())); }
  function pouchBal(p) {
    var b = Number(p.init) || 0;
    vals('txs').forEach(function (t) {
      var a = Number(t.amount) || 0;
      if (t.type === 'out' && t.from === p.id) b -= a;
      if (t.type === 'in' && t.to === p.id) b += a;
      if (t.type === 'move') { if (t.from === p.id) b -= a; if (t.to === p.id) b += a; }
    });
    return b;
  }
  function pouchName(id) { return S.pouches[id] ? S.pouches[id].name : '已刪除的錢袋'; }
  function monthSpend(prefix) {
    return vals('txs').reduce(function (s, t) { return t.type === 'out' && String(t.date).indexOf(prefix) === 0 ? s + (Number(t.amount) || 0) : s; }, 0);
  }
  function sortedPouches() { return vals('pouches').sort(function (a, b) { return (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(b.name); }); }

  // ---------- storage ----------
  function saveLocal() { try { localStorage.setItem(LS_DATA, JSON.stringify(S)); } catch (e) {} }
  function loadLocal() {
    try { var raw = localStorage.getItem(LS_DATA); if (raw) { var d = JSON.parse(raw); COLLS.forEach(function (c) { S[c] = d[c] || {}; }); } } catch (e) {}
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function put(coll, obj) {
    obj = clone(obj);
    S[coll][obj.id] = obj;
    render();
    if (db) return db.collection(coll).doc(obj.id).set(obj).catch(function (e) { toast(e && e.code === 'quota_exceeded' ? '存放空間滿了，請先刪掉一些舊紀錄' : '沒存到，請檢查網路後再試一次'); });
    saveLocal();
    return Promise.resolve();
  }
  function remove(coll, id) {
    delete S[coll][id];
    render();
    if (db) return db.collection(coll).doc(id).delete().catch(function () { toast('刪除失敗，請稍後再試'); });
    saveLocal();
    return Promise.resolve();
  }

  // ---------- views ----------
  function tileHTML(i, showSlot) {
    var d = dur(i);
    return '<button type="button" class="tile" data-act="item" data-id="' + esc(i.id) + '" style="--rc:' + rc(i) + '">' +
      (i.qty > 1 ? '<span class="qty pxlabel">x' + esc(i.qty) + '</span>' : '') +
      (showSlot ? '<span class="slot">' + esc(i.slot || KIND[i.kind] || '') + '</span>' : '') +
      '' + glyphHTML(i) + '' +
      '<span class="tname">' + esc(i.name) + '</span>' + bar(d) + '</button>';
  }

  function sampleBanner() {
    var has = COLLS.some(function (c) { return vals(c).some(function (x) { return x.sample; }); });
    if (!has) return '';
    return '<div class="banner"><span>現在看到的是<b>範例資料</b>，玩玩看再清掉，換成你自己的東西。</span><button type="button" class="puff sm" data-act="clear-samples">清除範例</button></div>';
  }

  function viewHome() {
    var act = activeItems();
    var pouches = sortedPouches();
    var total = pouches.reduce(function (s, p) { return s + pouchBal(p); }, 0);
    var now = today();
    var spend = monthSpend(now.slice(0, 7));
    var gearVal = act.reduce(function (s, i) { return s + (Number(i.price) || 0); }, 0);
    var first = vals('items').reduce(function (m, i) { return !m || i.acquired < m ? i.acquired : m; }, null);
    var adventure = first ? daysBetween(first, now) + 1 : 1;
    var equipped = act.filter(function (i) { return i.equipped; }).sort(function (a, b) { return SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot); });
    var alerts = act.map(function (i) { return { i: i, d: dur(i) }; }).filter(function (x) { return x.d != null && x.d <= 25; }).sort(function (a, b) { return a.d - b.d; });

    var h = '<header class="row between"><div class="stack" style="gap:2px"><span class="eyebrow">DAY ' + adventure + '</span>' +
      '<h1>' + chest(26) + '我的裝備庫</h1></div>' +
      '<button type="button" class="x" data-act="settings" aria-label="設定"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button></header>';
    h += sampleBanner();

    if (!act.length && !pouches.length) {
      h += '<section class="card stack welcome">' + chest(56) + '' +
        '<h2>背包還是空的</h2><p class="muted" style="margin:0">先建立一個錢袋（例如銀行、現金），再把身上的第一件裝備放進來。</p>' +
        '<div class="row" style="flex-wrap:wrap;justify-content:center"><button type="button" class="puff soft" data-act="pouch-new">建立錢袋</button><button type="button" class="puff primary" data-act="item-new">放入第一件物品</button></div></section>';
      return h;
    }

    h += '<button type="button" class="card stack" data-act="tab" data-tab="wallet" style="border:0;text-align:left;width:100%">' +
      '<span class="row between"><span class="eyebrow">GOLD · 金幣總額</span><span class="muted small">' + pouches.length + ' 個錢袋</span></span>' +
      '<span class="row">' + COIN + '<span class="num gold-total">' + money(total) + '</span></span>' +
      '<span class="mini-grid"><span class="mini"><span class="muted small">本月花費</span><span class="num">' + money(spend) + '</span></span>' +
      '<span class="mini"><span class="muted small">裝備總價值</span><span class="num">' + money(gearVal) + '</span></span></span></button>';

    h += '<section class="stack"><div class="row between"><h2>裝備中</h2><button type="button" class="linkbtn" data-act="tab" data-tab="bag">打開背包</button></div><div class="tiles">';
    equipped.forEach(function (i) { h += tileHTML(i, true); });
    var emptyN = equipped.length < 3 ? 3 - equipped.length : (3 - equipped.length % 3) % 3;
    for (var k = 0; k < emptyN; k++) h += '<button type="button" class="empty-slot" data-act="item-new" data-equip="1">空格子</button>';
    h += '</div></section>';

    h += '<section class="stack"><h2 class="row" style="gap:8px">' + HEART + '耐久警告</h2>';
    if (!alerts.length) h += '<p class="muted small" style="margin:0">目前沒有快壞或快用完的東西。</p>';
    alerts.slice(0, 5).forEach(function (x) {
      var i = x.i, end = lifeEnd(i);
      var msg = '剩 ' + x.d + '%' + (end && i.durMode !== 'manual' ? '，' + (i.kind === 'item' ? '預計 ' + md(end) + ' 用完' : '預計 ' + md(end) + ' 該換新') : '');
      h += '<button type="button" class="alert" data-act="item" data-id="' + esc(i.id) + '" style="--rc:' + rc(i) + '">' + glyphHTML(i) + '' +
        '<span class="alert-body"><b>' + esc(i.name) + '</b><span class="small" style="color:' + (x.d < 20 ? 'var(--bad)' : 'var(--warn)') + '">' + msg + '</span></span>' +
        '<span class="tag">' + (i.kind === 'item' ? '補貨' : '查看') + '</span></button>';
    });
    h += '</section>';
    return h;
  }

  function viewBag() {
    var n = activeItems().length;
    var f = [['all', '全部'], ['gear', '裝備'], ['item', '消耗品'], ['keep', '收藏']];
    var h = '<header class="row between"><div class="stack" style="gap:2px"><h1>背包</h1><span class="muted small">' + n + ' 件物品</span></div>' +
      '<button type="button" class="puff primary sm" data-act="item-new">放入物品</button></header>';
    h += '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>' +
      '<input id="bag-q" type="search" placeholder="搜尋物品" aria-label="搜尋物品" value="' + esc(bagQ) + '"></label>';
    h += '<div class="chips" role="group" aria-label="篩選">';
    f.forEach(function (x) { h += '<button type="button" class="chip" data-act="bag-filter" data-f="' + x[0] + '" aria-pressed="' + (bagFilter === x[0]) + '">' + x[1] + '</button>'; });
    h += '</div><div class="row small muted" style="gap:14px;flex-wrap:wrap">';
    ['common', 'rare', 'epic', 'legend'].forEach(function (r) { h += '<span class="row" style="gap:5px;--rc:' + RAR[r].c + '"><span class="dot"></span>' + RAR[r].n + '</span>'; });
    h += '</div><div id="bag-grid"></div>';
    return h;
  }
  function renderBagGrid() {
    var el = $('#bag-grid'); if (!el) return;
    var q = bagQ.trim().toLowerCase();
    var list = activeItems().filter(function (i) {
      return (bagFilter === 'all' || i.kind === bagFilter) && (!q || String(i.name).toLowerCase().indexOf(q) >= 0 || String(i.note || '').toLowerCase().indexOf(q) >= 0);
    }).sort(function (a, b) { return (RAR_ORDER[a.rarity] || 3) - (RAR_ORDER[b.rarity] || 3) || String(b.acquired).localeCompare(String(a.acquired)); });
    if (!list.length) { el.innerHTML = '<div class="card welcome stack"><p class="muted" style="margin:0">' + (q ? '找不到「' + esc(bagQ) + '」。' : '這一格還沒有東西。') + '</p><button type="button" class="puff primary" data-act="item-new">放入物品</button></div>'; return; }
    var h = '<div class="tiles four">';
    list.forEach(function (i) { h += tileHTML(i, false); });
    h += '</div>';
    el.innerHTML = h;
  }

  function viewWallet() {
    var pouches = sortedPouches();
    var total = pouches.reduce(function (s, p) { return s + pouchBal(p); }, 0);
    var now = today(), m = now.slice(0, 7);
    var lm = parseD(now); lm.setDate(1); lm.setMonth(lm.getMonth() - 1);
    var lastM = fmtD(lm).slice(0, 7);
    var spend = monthSpend(m), last = monthSpend(lastM);
    var h = '<header class="stack" style="gap:2px"><span class="eyebrow">GOLD · 金幣總額</span>' +
      '<span class="row">' + COIN + '<span class="num gold-total">' + money(total) + '</span></span>' +
      '<span class="muted small">本月花費 ' + money(spend) + ' · 上個月 ' + money(last) + '</span></header>';
    h += '<div class="row" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr))">' +
      '<button type="button" class="puff primary" data-act="tx-new" data-type="out">花費</button>' +
      '<button type="button" class="puff" data-act="tx-new" data-type="in">收入</button>' +
      '<button type="button" class="puff" data-act="tx-new" data-type="move">轉移</button></div>';
    h += '<section class="stack"><h2>錢袋</h2><div class="pouches">';
    pouches.forEach(function (p) {
      var b = pouchBal(p);
      h += '<button type="button" class="pouch" data-act="pouch-edit" data-id="' + esc(p.id) + '"><span class="muted small">' + esc(p.name) + '</span><span class="num" style="color:' + (b < 0 ? 'var(--neg)' : 'var(--ink)') + '">' + money(b) + '</span></button>';
    });
    h += '<button type="button" class="pouch add" data-act="pouch-new">＋ 新錢袋</button></div></section>';

    var cats = {};
    vals('txs').forEach(function (t) { if (t.type === 'out' && String(t.date).indexOf(m) === 0) cats[t.cat || '其他'] = (cats[t.cat || '其他'] || 0) + (Number(t.amount) || 0); });
    var ck = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
    if (ck.length) {
      var max = cats[ck[0]];
      h += '<section class="card stack"><h2>這個月花在哪</h2>';
      ck.forEach(function (c) { h += '<div class="catrow"><span>' + esc(c) + '</span><span class="bar"><span style="width:' + Math.max(3, cats[c] / max * 100) + '%"></span></span><span class="num">' + money(cats[c]) + '</span></div>'; });
      h += '</section>';
    }

    var txs = vals('txs').sort(function (a, b) { return String(b.date).localeCompare(String(a.date)) || (b.created || 0) - (a.created || 0); }).slice(0, 60);
    h += '<section class="stack" style="gap:0"><h2 style="margin-bottom:6px">交易紀錄</h2>';
    if (!txs.length) h += '<p class="muted small" style="margin:0">還沒有任何交易。按上面的「花費」記第一筆。</p>';
    var day = null;
    txs.forEach(function (t) {
      if (t.date !== day) { day = t.date; h += '<div class="txday">' + (day === now ? '今天' : day === addDays(now, -1) ? '昨天' : ymd(day)) + '</div>'; }
      var sign = t.type === 'out' ? '−' : t.type === 'in' ? '+' : '';
      var meta = t.type === 'move' ? pouchName(t.from) + ' → ' + pouchName(t.to) : (t.type === 'out' ? pouchName(t.from) : pouchName(t.to)) + ' · ' + esc(t.cat || '其他');
      h += '<button type="button" class="tx" data-act="tx-view" data-id="' + esc(t.id) + '"><span class="tx-body"><b>' + esc(t.note || t.cat || (t.type === 'move' ? '轉移' : '交易')) + '</b><span class="muted small">' + meta + '</span></span>' +
        (t.itemId ? '<span class="loot">入庫 +1</span>' : '') +
        '<span class="num amt ' + t.type + '">' + sign + money(t.amount) + '</span></button>';
    });
    h += '</section>';
    return h;
  }

  function viewHall() {
    var list = vals('items').filter(function (i) { return i.status === 'retired'; }).sort(function (a, b) { return String(b.retiredAt).localeCompare(String(a.retiredAt)); });
    var h = '<header class="stack" style="gap:2px"><h1>名人堂</h1><span class="muted small">退役的裝備會留在這裡，記得它們陪了你多久。</span></header>';
    if (!list.length) h += '<div class="card welcome stack">' + TROPHY + '<p class="muted" style="margin:0">還沒有退役的裝備。東西壞了、送人或賣掉時，在物品卡按「退役」，它就會來到這裡。</p></div>';
    list.forEach(function (i) {
      var days = itemDays(i);
      h += '<button type="button" class="hall-item" data-act="item" data-id="' + esc(i.id) + '" style="--rc:' + rc(i) + '">' + glyphHTML(i) + '' +
        '<span class="alert-body"><b>' + esc(i.name) + '</b><span class="muted small">' + ymd(i.acquired) + ' – ' + ymd(i.retiredAt) + ' · 陪伴 ' + days + ' 天</span>' +
        '<span class="small">' + esc(i.retireReason || '退役') + ' · 每日成本 ' + (itemCost(i) / days).toFixed(1) + '</span></span></button>';
    });

  function render() {
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'); });
    var v = $('#view');
    if (mode === 'loading') {
      v.innerHTML = '<div class="card welcome stack" style="margin-top:30vh">' + chest(48) + '<p class="eyebrow blink" style="margin:0">LOADING...</p></div>';
      return;
    }
    var active = document.activeElement && document.activeElement.id === 'bag-q';
    v.innerHTML = { home: viewHome, bag: viewBag, wallet: viewWallet, hall: viewHall }[tab]();
    if (tab === 'bag') {
      renderBagGrid();
      if (active) { var q = $('#bag-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    if (sheet && sheet.live) openSheet(sheet);
  }

  // ---------- sheets ----------
  function openSheet(def) {
    sheet = def;
    var body = $('#sheet-body');
    var keep = body.scrollTop;
    body.innerHTML = '<div class="grab"></div><div class="sheet-head"><h2 id="sheet-title">' + esc(def.title) + '</h2>' +
      '<button type="button" class="x" data-act="close" aria-label="關閉"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>' + def.html();
    sheetSubmit = def.submit || null;
    var wasHidden = $('#sheet').hidden;
    $('#sheet').hidden = false;
    if (wasHidden) { body.scrollTop = 0; var f = body.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox])'); if (f && def.focus !== false) f.focus(); }
    else body.scrollTop = keep;
    if (def.after) def.after(body);
  }
  function closeSheet() { sheet = null; sheetSubmit = null; $('#sheet').hidden = true; $('#sheet-body').innerHTML = ''; }

  function pouchOptions(sel, allowNone) {
    var h = allowNone ? '<option value="">不從錢袋扣（只記物品）</option>' : '';
    sortedPouches().forEach(function (p) { h += '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '（' + money(pouchBal(p)) + '）</option>'; });
    return h;
  }
  function seg(name, opts, cur) {
    var h = '<div class="seg" role="radiogroup">';
    opts.forEach(function (o) { h += '<label><input type="radio" name="' + name + '" value="' + o[0] + '"' + (o[0] === cur ? ' checked' : '') + '><span>' + o[1] + '</span></label>'; });
    return h + '</div>';

  // ---------- photo: background removal + pixel sprite ----------
  var photoState = null;
  function drawEmpty(cv) {
    var x = cv.getContext('2d'); x.clearRect(0, 0, cv.width, cv.height);
    x.fillStyle = 'rgba(0,0,0,.18)'; x.font = '700 13px "Noto Sans TC", sans-serif'; x.textAlign = 'center'; x.fillText('還沒有照片', cv.width / 2, cv.height / 2 + 5);
  }
  function drawPreview(cv, url, pixel) {
    var im = new Image();
    im.onload = function () {
      var x = cv.getContext('2d'); x.clearRect(0, 0, cv.width, cv.height);
      x.imageSmoothingEnabled = !pixel;
      var s = Math.min((cv.width - 12) / im.width, (cv.height - 12) / im.height);
      if (pixel) s = Math.max(1, Math.floor(s));
      var w = im.width * s, h = im.height * s;
      x.drawImage(im, Math.round((cv.width - w) / 2), Math.round((cv.height - h) / 2), w, h);
    };
    im.src = url;
  }
  // Flood-fills from the photo's edges, erasing pixels close to the edge colors.
  function cutout(im, tol) {
    var s = Math.min(1, 360 / Math.max(im.width, im.height));
    var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, w, h);
    var d = x.getImageData(0, 0, w, h), p = d.data;
    if (tol > 0) {
      var thr = Math.pow(tol * 1.3, 2), step = thr * 0.12, seen = {}, samples = [];
      function addS(i) { var k = (p[i * 4] >> 4) + ',' + (p[i * 4 + 1] >> 4) + ',' + (p[i * 4 + 2] >> 4); if (!seen[k]) { seen[k] = 1; samples.push([p[i * 4], p[i * 4 + 1], p[i * 4 + 2]]); } }
      for (var a = 0; a < w; a++) { addS(a); addS((h - 1) * w + a); }
      for (var b = 0; b < h; b++) { addS(b * w); addS(b * w + w - 1); }
      function nearBg(i) {
        var r = p[i * 4], g = p[i * 4 + 1], bl = p[i * 4 + 2];
        for (var k = 0; k < samples.length; k++) { var sm = samples[k], dr = r - sm[0], dg = g - sm[1], db2 = bl - sm[2]; if (dr * dr + dg * dg + db2 * db2 < thr) return true; }
        return false;
      }
      function nearPx(i, j) { var dr = p[i * 4] - p[j * 4], dg = p[i * 4 + 1] - p[j * 4 + 1], db2 = p[i * 4 + 2] - p[j * 4 + 2]; return dr * dr + dg * dg + db2 * db2 < step; }
      var vis = new Uint8Array(w * h), q = new Int32Array(w * h), qh = 0, qt = 0;
      function seed(i) { if (!vis[i] && nearBg(i)) { vis[i] = 1; q[qt++] = i; } }
      for (a = 0; a < w; a++) { seed(a); seed((h - 1) * w + a); }
      for (b = 0; b < h; b++) { seed(b * w); seed(b * w + w - 1); }
      while (qh < qt) {
        var i = q[qh++], px = i % w, py = (i - px) / w;
        var nb = [px > 0 ? i - 1 : -1, px < w - 1 ? i + 1 : -1, py > 0 ? i - w : -1, py < h - 1 ? i + w : -1];
        for (var n = 0; n < 4; n++) { var j = nb[n]; if (j >= 0 && !vis[j] && (nearBg(j) || nearPx(i, j))) { vis[j] = 1; q[qt++] = j; } }
      }
      for (i = 0; i < w * h; i++) if (vis[i]) p[i * 4 + 3] = 0;
      for (i = 0; i < w * h; i++) {
        if (vis[i]) continue;
        px = i % w; py = (i - px) / w;
        if ((px > 0 && vis[i - 1]) || (px < w - 1 && vis[i + 1]) || (py > 0 && vis[i - w]) || (py < h - 1 && vis[i + w])) p[i * 4 + 3] = 150;
      }
      x.putImageData(d, 0, 0);
    }
    var minX = w, minY = h, maxX = -1, maxY = -1;
    for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) if (p[(yy * w + xx) * 4 + 3] > 40) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; if (yy < minY) minY = yy; if (yy > maxY) maxY = yy; }
    if (maxX < 0 || (maxX - minX) * (maxY - minY) < w * h * 0.01) { toast('去背太強了，把強度調低一點'); return c; }
    var o = document.createElement('canvas'); o.width = maxX - minX + 1; o.height = maxY - minY + 1;
    o.getContext('2d').drawImage(c, minX, minY, o.width, o.height, 0, 0, o.width, o.height);
    return o;
  }
  // Shrinks the cutout to an N×N sprite: hard alpha, slight posterize, dark outline.
  function pixelate(src, n) {
    var c = document.createElement('canvas'); c.width = n; c.height = n;
    var x = c.getContext('2d', { willReadFrequently: true });
    var inner = n - 2, s = inner / Math.max(src.width, src.height);
    var w = Math.max(1, Math.round(src.width * s)), h = Math.max(1, Math.round(src.height * s));

    x.drawImage(src, Math.floor((n - w) / 2), Math.floor((n - h) / 2), w, h);
    var d = x.getImageData(0, 0, n, n), p = d.data, solid = new Uint8Array(n * n);
    for (var i = 0; i < n * n; i++) {
      if (p[i * 4 + 3] < 120) { p[i * 4 + 3] = 0; continue; }
      solid[i] = 1; p[i * 4 + 3] = 255;
      for (var k = 0; k < 3; k++) p[i * 4 + k] = Math.min(255, Math.round(p[i * 4 + k] / 28) * 28);
    }
    for (i = 0; i < n * n; i++) {
      if (solid[i]) continue;
      var px = i % n, py = (i - px) / n;
      if ((px > 0 && solid[i - 1]) || (px < n - 1 && solid[i + 1]) || (py > 0 && solid[i - n]) || (py < n - 1 && solid[i + n])) {

      }
    }
    x.putImageData(d, 0, 0);
    return c.toDataURL('image/png');
  }
  function plainOut(src) {

  }

      html: function () {
        return '<form class="stack"><div class="two"><label class="field" for="r-qty">補幾個<input id="r-qty" type="number" inputmode="numeric" min="1" step="1" name="qty" value="1"></label>' +
          '<label class="field" for="r-price">花了多少<input id="r-price" type="number" inputmode="decimal" min="0" name="price" value="' + esc(i.price || '') + '"></label></div>' +
          '<label class="field" for="r-date">日期<input id="r-date" type="date" name="date" value="' + today() + '"></label>' +
          '<label class="field" for="r-pay">從哪個錢袋付<select id="r-pay" name="pay">' + pouchOptions(lastPouch(), true) + '</select></label>' +
          '<span class="hint">補貨後耐久會從 100% 重新開始算。</span><button type="submit" class="puff primary">補貨</button></form>';
      },
      submit: function (fd) {
        var o = clone(S.items[id]);
        var n = Math.max(1, Number(fd.get('qty')) || 1), price = Number(fd.get('price')) || 0, date = fd.get('date') || today();
        o.qty = (Number(o.qty) || 0) + n; o.acquired = date; o.durMode = 'auto'; o.manual = null; if (price) o.price = price;
        o.log = (o.log || []).concat([{ d: date, t: 'restock', text: '補貨 ×' + n, cost: 0 }]);
        var pay = fd.get('pay');
        if (pay && price > 0) { rememberPouch(pay); put('txs', { id: uid(), type: 'out', amount: price, from: pay, cat: '日用品', note: o.name + ' 補貨', date: date, itemId: o.id, created: Date.now() }); }
        put('items', o); sheetItem(id); toast('補貨完成');
      }
    });
  }

  function sheetRepair(id) {
    var i = S.items[id];
    openSheet({
      title: '修理 / 保養：' + i.name,
      html: function () {
        return '<form class="stack"><label class="field" for="p-text">做了什麼<input id="p-text" name="text" required maxlength="40" placeholder="例如：換電池、送洗"></label>' +
          '<div class="two"><label class="field" for="p-cost">花費<input id="p-cost" type="number" inputmode="decimal" min="0" name="cost" placeholder="0"></label>' +
          '<label class="field" for="p-date">日期<input id="p-date" type="date" name="date" value="' + today() + '"></label></div>' +
          '<label class="field" for="p-pay">從哪個錢袋付<select id="p-pay" name="pay">' + pouchOptions(lastPouch(), true) + '</select></label>' +
          '<label class="field" for="p-dur">修好後耐久（選填）<input id="p-dur" type="number" inputmode="numeric" min="0" max="100" name="dur" placeholder="不變"></label>' +
          '<button type="submit" class="puff primary">記下來</button></form>';
      },
      submit: function (fd) {
        var o = clone(S.items[id]);
        var text = String(fd.get('text') || '').trim() || '保養', cost = Number(fd.get('cost')) || 0, date = fd.get('date') || today();
        o.log = (o.log || []).concat([{ d: date, t: 'repair', text: text, cost: cost }]);
        if (fd.get('dur') !== '' && fd.get('dur') != null) { o.durMode = 'manual'; o.manual = clamp(Number(fd.get('dur')) || 0, 0, 100); }
        var pay = fd.get('pay');
        if (pay && cost > 0) { rememberPouch(pay); put('txs', { id: uid(), type: 'out', amount: cost, from: pay, cat: '裝備', note: o.name + '：' + text, date: date, itemId: o.id, created: Date.now() }); }
        put('items', o); sheetItem(id); toast('已記錄');
      }
    });
  }

  function sheetRetire(id) {
    var i = S.items[id];
    openSheet({
      title: '退役：' + i.name,
      html: function () {
        return '<form class="stack"><div class="field">原因' + seg('reason', [['壞了', '壞了'], ['用完', '用完'], ['送人', '送人'], ['賣掉', '賣掉'], ['遺失', '遺失']], i.kind === 'item' ? '用完' : '壞了') + '</div>' +
          '<label class="field" for="t-date">日期<input id="t-date" type="date" name="date" value="' + today() + '"></label>' +
          '<div class="two" data-sale><label class="field" for="t-sale">賣了多少<input id="t-sale" type="number" inputmode="decimal" min="0" name="sale" placeholder="0"></label>' +
          '<label class="field" for="t-pay">收進哪個錢袋<select id="t-pay" name="pay">' + pouchOptions(lastPouch(), true) + '</select></label></div>' +
          '<button type="submit" class="puff primary">送進名人堂</button></form>';
      },
      after: function (body) {
        var f = body.querySelector('form');
        function sync() { body.querySelector('[data-sale]').hidden = f.reason.value !== '賣掉'; }
        f.addEventListener('change', sync); sync();
      },
      submit: function (fd) {
        var o = clone(S.items[id]); var reason = fd.get('reason'), date = fd.get('date') || today();
        o.status = 'retired'; o.retiredAt = date; o.retireReason = reason; o.equipped = false;
        o.log = (o.log || []).concat([{ d: date, t: 'retire', text: '退役（' + reason + '）', cost: 0 }]);
        var sale = Number(fd.get('sale')) || 0, pay = fd.get('pay');
        if (reason === '賣掉' && sale > 0 && pay) put('txs', { id: uid(), type: 'in', amount: sale, to: pay, cat: '賣出', note: '賣掉 ' + o.name, date: date, itemId: o.id, created: Date.now() });
        put('items', o); closeSheet(); toast('「' + o.name + '」進入名人堂');
      }
    });
  }

  function sheetTx(type) {
    if (!vals('pouches').length) { toast('先建立一個錢袋'); sheetPouch(null); return; }
    var lp = lastPouch() && S.pouches[lastPouch()] ? lastPouch() : sortedPouches()[0].id;
    openSheet({
      title: '記一筆',
      html: function () {
        var outC = '', inC = '';
        OUTCATS.forEach(function (c) { outC += '<option>' + c + '</option>'; });
        INCATS.forEach(function (c) { inC += '<option>' + c + '</option>'; });
        return '<form class="stack" id="f-tx">' + seg('type', [['out', '花費'], ['in', '收入'], ['move', '轉移']], type) +
          '<label class="field" for="x-amt">金額<input id="x-amt" type="number" inputmode="decimal" min="0" step="any" name="amount" required placeholder="0" style="font-family:var(--f-num);font-size:26px;font-weight:800;min-height:58px"></label>' +
          '<label class="field" for="x-note">內容<input id="x-note" name="note" maxlength="40" placeholder="例如：午餐"></label>' +
          '<div class="two"><label class="field" for="x-from" data-t="out move">從<select id="x-from" name="from">' + pouchOptions(lp) + '</select></label>' +
          '<label class="field" for="x-to" data-t="in move">到<select id="x-to" name="to">' + pouchOptions(lp) + '</select></label>' +
          '<label class="field" for="x-cat-o" data-t="out">分類<select id="x-cat-o" name="cato">' + outC + '</select></label>' +
          '<label class="field" for="x-cat-i" data-t="in">分類<select id="x-cat-i" name="cati">' + inC + '</select></label></div>' +
          '<label class="field" for="x-date">日期<input id="x-date" type="date" name="date" value="' + today() + '"></label>' +
          '<button type="submit" class="puff primary">記下來</button></form>';
      },
      after: function (body) {
        var f = body.querySelector('#f-tx');
        function sync() { var t = f.type.value; body.querySelectorAll('[data-t]').forEach(function (el) { el.hidden = el.dataset.t.split(' ').indexOf(t) < 0; }); }
        f.addEventListener('change', sync); sync();
        setTimeout(function () { var a = body.querySelector('#x-amt'); if (a) a.focus(); }, 30);
      },
      submit: function (fd) {
        var t = fd.get('type'), amt = Number(fd.get('amount'));
        if (!(amt > 0)) { toast('請輸入大於 0 的金額'); return; }
        if (t === 'move' && fd.get('from') === fd.get('to')) { toast('轉出和轉入要是不同的錢袋'); return; }
        var o = { id: uid(), type: t, amount: amt, note: String(fd.get('note') || '').trim(), date: fd.get('date') || today(), created: Date.now() };
        if (t !== 'in') o.from = fd.get('from');
        if (t !== 'out') o.to = fd.get('to');
        if (t === 'out') o.cat = fd.get('cato');
        if (t === 'in') o.cat = fd.get('cati');
        rememberPouch(o.from || o.to);
        put('txs', o); closeSheet(); toast('記好了');
      }
    });
  }

  function sheetTxView(id) {
    var t = S.txs[id];
    openSheet({
      title: '交易明細', focus: false,
      html: function () {
        var item = t.itemId && S.items[t.itemId];
        return '<div class="card stack"><span class="num" style="font-size:32px">' + (t.type === 'out' ? '−' : t.type === 'in' ? '+' : '') + money(t.amount) + '</span>' +
          '<b>' + esc(t.note || t.cat || '轉移') + '</b><span class="muted small">' + ymd(t.date) + ' · ' +
          (t.type === 'move' ? pouchName(t.from) + ' → ' + pouchName(t.to) : (t.type === 'out' ? '從 ' + pouchName(t.from) : '進 ' + pouchName(t.to)) + ' · ' + esc(t.cat || '')) + '</span></div>' +
          (item ? '<button type="button" class="puff" data-act="item" data-id="' + esc(item.id) + '">查看物品：' + esc(item.name) + '</button>' : '') +
          '<button type="button" class="puff danger" data-act="confirm" data-do="tx-delete" data-id="' + esc(t.id) + '">刪除這筆</button>' +
          (item ? '<span class="hint">刪除交易不會把物品移出背包。</span>' : '');
      }
    });
  }

  function sheetPouch(id) {
    var p = id ? S.pouches[id] : null;
    openSheet({
      title: p ? '編輯錢袋' : '新錢袋',
      html: function () {
        return '<form class="stack"><label class="field" for="w-name">名稱<input id="w-name" name="name" required maxlength="20" value="' + esc(p ? p.name : '') + '" placeholder="例如：現金、銀行、信用卡"></label>' +
          '<label class="field" for="w-init">起始金額<input id="w-init" type="number" inputmode="decimal" step="any" name="init" value="' + esc(p ? p.init : '') + '" placeholder="0"><span class="hint">現在裡面有多少錢。信用卡欠款可以填負數。</span></label>' +
          (p ? '<span class="muted small">目前餘額 ' + money(pouchBal(p)) + '</span>' : '') +
          '<button type="submit" class="puff primary">' + (p ? '儲存' : '建立') + '</button>' +
          (p ? '<button type="button" class="linkbtn" style="color:var(--danger);align-self:center" data-act="confirm" data-do="pouch-delete" data-id="' + esc(p.id) + '">刪除這個錢袋</button>' : '') + '</form>';
      },
      submit: function (fd) {
        var o = p ? clone(p) : { id: uid(), order: Date.now() };
        o.name = String(fd.get('name') || '').trim() || '錢袋'; o.init = Number(fd.get('init')) || 0; delete o.sample;
        put('pouches', o); closeSheet(); toast(p ? '已儲存' : '建立了「' + o.name + '」');
      }
    });
  }

  function sheetFab() {
    openSheet({
      title: '要記什麼？', focus: false,
      html: function () {
        return '<div class="stack"><button type="button" class="puff primary" data-act="item-new" style="min-height:58px">獲得新物品</button>' +
          '<button type="button" class="puff" data-act="tx-new" data-type="out" style="min-height:58px">記一筆花費</button>' +
          '<button type="button" class="puff" data-act="tx-new" data-type="in" style="min-height:58px">記一筆收入</button></div>';
      }
    });
  }

  function sheetSettings() {
    openSheet({
      title: '設定', focus: false,
      html: function () {
        var cur = document.documentElement.dataset.palette || 'night';
        var h = '<section class="stack"><h3>主題色</h3><div class="palettes">';
        PALETTES.forEach(function (p) { h += '<button type="button" class="pal" data-act="palette" data-k="' + p.k + '" aria-pressed="' + (cur === p.k) + '"><i style="background:' + p.c + '"></i>' + p.n + '</button>'; });
        h += '</div></section><section class="card stack"><h3>資料</h3><span class="muted small">' +
          (mode === 'cloud' ? '資料存在雲端，只有你看得到，換裝置打開這個連結也會在。' : '目前資料只存在這個瀏覽器裡，清除瀏覽資料就會不見，記得定期匯出。') + '</span>' +
          (dl ? '<button type="button" class="puff" data-act="export">匯出備份（JSON）</button>' : '') + '</section>';
        return h;
      }
    });
  }

  // ---------- actions ----------
  function setPalette(k) {
    if (k === 'night') delete document.documentElement.dataset.palette; else document.documentElement.dataset.palette = k;
    try { localStorage.setItem(LS_PAL, k); } catch (e) {}
  }
  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function doConfirmed(what, id) {
    if (what === 'item-delete') {
      remove('items', id); closeSheet(); toast('已刪除');
    } else if (what === 'tx-delete') {
      remove('txs', id); closeSheet(); toast('已刪除這筆');
    } else if (what === 'pouch-delete') {
      remove('pouches', id); closeSheet(); toast('已刪除錢袋');
    } else if (what === 'clear-samples') {
      COLLS.forEach(function (c) { vals(c).forEach(function (x) { if (x.sample) remove(c, x.id); }); });
      toast('範例清掉了，開始放你自己的東西吧');
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) { if (e.target.id === 'sheet') closeSheet(); return; }
    var a = el.dataset.act, id = el.dataset.id;
    if (a === 'tab') { tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); }
    else if (a === 'close') closeSheet();
    else if (a === 'fab') { if (tab === 'wallet') sheetTx('out'); else sheetFab(); }
    else if (a === 'item') sheetItem(id);
    else if (a === 'item-new') sheetItemForm(null, { equip: el.dataset.equip });
    else if (a === 'item-edit') sheetItemForm(id);
    else if (a === 'bag-filter') { bagFilter = el.dataset.f; render(); }
    else if (a === 'toggle-equip') { var o = clone(S.items[id]); o.equipped = !o.equipped; put('items', o); toast(o.equipped ? '裝備上了' : '已卸下'); }
    else if (a === 'use-one') { var u = clone(S.items[id]); u.qty = Math.max(0, (Number(u.qty) || 0) - 1); put('items', u); toast('剩 ' + u.qty + ' 個'); }
    else if (a === 'restock') sheetRestock(id);
    else if (a === 'repair') sheetRepair(id);
    else if (a === 'retire') sheetRetire(id);
    else if (a === 'unretire') { var r = clone(S.items[id]); r.status = 'active'; r.retiredAt = null; r.retireReason = null; put('items', r); toast('回到背包了'); }
    else if (a === 'tx-new') sheetTx(el.dataset.type);
    else if (a === 'tx-view') sheetTxView(id);
    else if (a === 'pouch-new') sheetPouch(null);
    else if (a === 'pouch-edit') sheetPouch(id);
    else if (a === 'settings') sheetSettings();
    else if (a === 'palette') { setPalette(el.dataset.k); sheetSettings(); }
    else if (a === 'export') exportData();
    else if (a === 'clear-samples' || a === 'confirm') {
      var what = a === 'confirm' ? el.dataset.do : 'clear-samples';
      if (el.dataset.armed) { doConfirmed(what, id); return; }
      el.dataset.armed = '1'; el.dataset.label = el.textContent; el.textContent = '再按一次確認';
      setTimeout(function () { if (el.isConnected) { delete el.dataset.armed; el.textContent = el.dataset.label; } }, 3000);
    }
  });
  // durability mode buttons carry no data-id; resolve from the open item sheet
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act="durmode"]'); if (!el || !sheet || !sheet.itemId) return;
    var i = clone(S.items[sheet.itemId]); if (!i) return;
    i.durMode = el.dataset.mode;
    if (i.durMode === 'manual' && i.manual == null) i.manual = autoDur(i) == null ? 100 : autoDur(i);
    put('items', i);
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (sheetSubmit) sheetSubmit(new FormData(e.target));
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'bag-q') { bagQ = e.target.value; renderBagGrid(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet) closeSheet(); });

  function exportData() {
    if (!dl) return;
    var data = JSON.stringify({ app: '我的裝備庫', version: 1, exportedAt: new Date().toISOString(), items: vals('items'), txs: vals('txs'), pouches: vals('pouches') }, null, 2);
    dl.save({ filename: '裝備庫備份-' + today() + '.json', data: data }).then(function () { toast('備份已匯出'); }, function (e) { if (!e || e.code !== 'declined') toast('匯出沒有成功，請稍後再試'); });
  }

  // ---------- boot ----------
  try { var pal = localStorage.getItem(LS_PAL); if (pal && pal !== 'night') document.documentElement.dataset.palette = pal; } catch (e) {}
  render();

  function startLocal() { loadLocal(); mode = 'local'; render(); }
  var use = window.claude && window.claude.use;
  if (!use) { startLocal(); return; }
  Promise.all([window.claude.use('db'), window.claude.use('downloads')]).then(function (r) {
    db = r[0]; dl = r[1];
    if (!db) { startLocal(); return; }
    mode = 'cloud';
    var seen = {};
    COLLS.forEach(function (c) {
      db.collection(c).onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (d) { var v = clone(d.data()); v.id = d.id; m[d.id] = v; });
        S[c] = m; seen[c] = true;
        render();
      }, function () { toast('同步中斷了，重新整理頁面就會恢復'); });
    });
    render();
  }, startLocal);
})();
</script>

</body>
</html>
